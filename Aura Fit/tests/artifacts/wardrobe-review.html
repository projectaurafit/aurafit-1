<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Fit — wardrobe review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf7f4;color:#1c1917;font:16px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:28px;line-height:1.2}p{max-width:850px;color:#695f58}nav{display:flex;flex-wrap:wrap;gap:18px;margin:24px 0}label{display:grid;gap:6px;font-weight:600}select{font:inherit;padding:10px 14px;border:1px solid #b7a99d;border-radius:10px;background:white;color:#1c1917}select:focus-visible,a:focus-visible{outline:3px solid #9a5a32;outline-offset:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{font-weight:700;margin-bottom:10px}img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid #e0d5cb;border-radius:12px}a{color:#89502e}small{font-weight:400;color:#695f58}@media(max-width:650px){main{padding:18px}.pair{grid-template-columns:1fr}}
</style>
<main>
<h1>Aura Fit wardrobe review</h1>
<p>Compare the layout before this review with the verified update. The earlier stretched-button fix is already present in “Before”; this pass improves artwork clearance and keyboard interactions.</p>
<p><a href="../../index.html#/wardrobe?mode=outfits">Open the working app</a> · <a href="../../QA-REPORT.md">Read the review report</a></p>
<nav aria-label="Screenshot comparison options">
<label>Screen<select id="screen"><option value="outfits">Saved outfits</option><option value="clothes">Wardrobe categories</option><option value="detail">Outfit details</option></select></label>
<label>Viewport width<select id="width"><option>320</option><option>390</option><option>768</option><option>1440</option></select></label>
<label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
</nav>
<div class="pair">
<figure><figcaption>Before <small>Start of this review</small></figcaption><a id="before-link"><img id="before" alt="Before this review"></a></figure>
<figure><figcaption>After <small>Updated layout</small></figcaption><a id="after-link"><img id="after" alt="After this review"></a></figure>
</div>
</main>
<script>
function show(){const name=document.getElementById('width').value+'-'+document.getElementById('theme').value+'-'+document.getElementById('screen').value+'.png';for(const state of ['before','after']){const path='wardrobe-review-'+state+'/'+name;document.getElementById(state).src=path;document.getElementById(state).alt=state+' — '+name.replace('.png','');document.getElementById(state+'-link').href=path;}}
document.querySelectorAll('select').forEach(select=>select.addEventListener('change',show));show();
</script>
</html>
