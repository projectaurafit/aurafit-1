  /* ==========================================================
     STORE HOOKS
     Wrap the auth calls so admin decisions actually bite:
     - suspended accounts cannot sign in
     - maintenance mode blocks non-admin sign-in
     - "allow new signups" off blocks register()
     - lastLogin is stamped on every successful sign-in
     ========================================================== */
  var patched = false;
  function patchStore() {
    if (patched) return; patched = true;

    var origLogin = S.login, origDemo = S.demoLogin, origRegister = S.register;

    S.login = function (email, pass) {
      ensure();
      var key = String(email || '').trim().toLowerCase();
      var u = S.state.users[key];
      if (u && u.status === 'suspended') return { ok: false, error: 'This account has been suspended. Please contact support.' };
      if (u && settings().maintenance && !isAdminEmail(key)) return { ok: false, error: 'Aura Fit is in maintenance mode. Please try again later.' };
      var r = origLogin.apply(S, arguments);
      return r;
    };
    S.demoLogin = function () {
      var r = origDemo.apply(S, arguments);
      ensure();
      if (r && r.ok && S.state.users[DEMO_EMAIL]) { S.state.users[DEMO_EMAIL].lastLogin = Date.now(); S.save(); }
      return r;
    };
    S.register = function (name, email, pass) {
      ensure();
      if (!settings().allowSignups) return { ok: false, error: 'New signups are currently closed. Please try again later.' };
      var r = origRegister.apply(S, arguments);
      if (r && r.ok) ensure();
      return r;
    };
  }

  /* Wrap a screen so it (a) renders the access-denied state for
     non-admins and (b) mounts inside its own root element. The shared
     .view element survives route changes, so delegated listeners bound
     to it would keep firing on later screens; binding to a per-screen

  function guarded(def) {

      return !!mountedRoot && formSnapshot(mountedRoot) !== mountedRoot._savedForm;
    };
    def.unmount = function () {
      closeMenu();
      if (activeDetailClose) activeDetailClose();
      if (stopSmtpTest) { stopSmtpTest(); stopSmtpTest = null; }
      if (unmount) unmount();
      mountedRoot = null;
    };
    def.render = function (params) {
      injectIcons(); patchStore();
      if (!isAdmin()) return denied();
      ensure();
      return '<div class="adm-screen">' + render(params) + '</div>';
    };
    def.mount = function (view, params) {
      if (!isAdmin()) return;
      var root = U.$('.adm-screen', view) || view;
      mountedRoot = root;
      U.on(root, 'input', '.field input,.field select,.field textarea', function (e, input) {
        setErr(root, input.id, '');
      });
      mount(root, params);
      markSaved(root);

  }

  /* ---- floating action menu (fixed, so table overflow cannot clip it) ---- */
  var openMenuNode = null, menuAnchor = null, activeDetailClose = null, stopSmtpTest = null;
  function closeMenu() {
    if (!openMenuNode) return;
    var n = openMenuNode; openMenuNode = null;
    if (menuAnchor) {
      menuAnchor.setAttribute('aria-expanded', 'false');
      if (n.contains(document.activeElement) && menuAnchor.isConnected) menuAnchor.focus();
      menuAnchor = null;
    }
    n.classList.remove('is-open');
    setTimeout(function () { n.remove(); }, 140);
    document.removeEventListener('click', outsideMenu, true);
    document.removeEventListener('keydown', escMenu);
    window.removeEventListener('scroll', closeMenu, true);
    window.removeEventListener('resize', closeMenu);
  }
  function outsideMenu(e) { if (openMenuNode && !openMenuNode.contains(e.target)) closeMenu(); }
  function escMenu(e) { if (e.key === 'Escape') closeMenu(); }

  function openMenu(anchor, items, onPick) {
    closeMenu();
    var m = U.el('<div class="adm-menu" role="menu">' + items.map(function (it) {
      return '<button class="adm-menu__item' + (it.danger ? ' is-danger' : '') + (it.disabled ? ' is-disabled' : '') + '" role="menuitem" data-act="' + it.id + '"' + (it.disabled ? ' disabled title="' + U.esc(it.why || '') + '"' : '') + '>' +
        U.icon(it.ico) + '<span>' + U.esc(it.label) + '</span></button>';
    }).join('') + '</div>');
    document.body.appendChild(m);
    openMenuNode = m;
    menuAnchor = anchor;
    anchor.setAttribute('aria-expanded', 'true');
    var first = m.querySelector('button:not(:disabled)');
    if (first) first.focus({ preventScroll: true });
    m.addEventListener('keydown', function (e) {
      var buttons = Array.from(m.querySelectorAll('button:not(:disabled)'));
      var index = buttons.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        buttons[(index + (e.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length].focus();
      }
      if (e.key === 'Tab') closeMenu();
    });

    var r = anchor.getBoundingClientRect();
    var mw = m.offsetWidth, mh = m.offsetHeight;
    var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    var top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    m.style.left = left + 'px'; m.style.top = top + 'px';
    requestAnimationFrame(function () { m.classList.add('is-open'); });

    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
      closeMenu(); onPick(b.dataset.act);
    });
    setTimeout(function () {
      if (openMenuNode !== m) return;
      document.addEventListener('click', outsideMenu, true);
      document.addEventListener('keydown', escMenu);
      window.addEventListener('scroll', closeMenu, true);
      window.addEventListener('resize', closeMenu);
    }, 0);
  }

  function doAction(email, act, done) {
    var u = S.state.users[email]; if (!u) return;
    var self = me() && me().email === email;
    var n = u.name || email;

    if (act === 'role') {
      if (self) return U.toast('You cannot remove your own admin access.', 'error');
      if (isOwner(email)) return U.toast('The owner account is always an admin.', 'error');
      var toAdmin = u.role !== 'admin';
      if (!attempt(function () { updateUser(email, { role: toAdmin ? 'admin' : 'user', roleChangedAt: Date.now() }); })) return;
      U.toast(toAdmin ? n + ' is now an admin' : 'Admin access removed for ' + n, 'success');
      return done && done();
    }
    if (act === 'status') {
      if (self || isOwner(email)) return U.toast('The owner and your own account cannot be suspended.', 'error');
      var toSusp = u.status !== 'suspended';
      if (!attempt(function () { updateUser(email, { status: toSusp ? 'suspended' : 'active', statusChangedAt: Date.now() }); })) return;
      U.toast(toSusp ? n + ' suspended' : n + ' reactivated', 'success');
      return done && done();
    }
    if (act === 'password') return openPassword(email, done);
    if (act === 'reset') {
      return U.toast('Email recovery is unavailable in this demo.', 'error');
    }
    if (act === 'delete') {
      if (self) return U.toast('You cannot delete your own account.', 'error');
      if (isOwner(email)) return U.toast('The owner account cannot be deleted.', 'error');
      U.confirmDialog({
        title: 'Delete ' + n + '?',

    }
  }

    if (cfg.testOk === true) return pill('ok', 'Demo test passed');

      user: val(view, 'smtp-user'),

      fromName: val(view, 'smtp-fromname'),
      fromEmail: val(view, 'smtp-fromemail').toLowerCase(),
      replyTo: val(view, 'smtp-replyto').toLowerCase()
    };

  function validateSmtp(v) {
    var e = {};
    if (!v.host) e['smtp-host'] = 'Host is required.';
    else if (!validHost(v.host)) e['smtp-host'] = 'Enter a valid hostname, e.g. smtp.example.com';
    if (!Number.isInteger(v.port) || v.port < 1 || v.port > 65535) e['smtp-port'] = 'Port must be a whole number between 1 and 65535.';
    if (v.user && !v.pass) e['smtp-pass'] = 'Password is required when a username is set.';
    if (v.pass && !v.user) e['smtp-user'] = 'Username is required when a password is set.';
    if (!v.fromName) e['smtp-fromname'] = 'From name is required.';
    if (!v.fromEmail) e['smtp-fromemail'] = 'From email is required.';
    else if (!validEmail(v.fromEmail)) e['smtp-fromemail'] = 'Enter a valid email address.';
    if (v.replyTo && !validEmail(v.replyTo)) e['smtp-replyto'] = 'Enter a valid email address.';
    return e;
  }

  /* deterministic pretend handshake - documented in the UI */
  function simulateHandshake(v, onStep, done) {
    var steps = [
      'Resolving ' + v.host + '…',
      'Connecting to ' + v.host + ':' + v.port + (v.enc === 'ssl' ? ' over SSL' : v.enc === 'tls' ? ' with STARTTLS' : '') + '…',
      v.user ? 'Authenticating as ' + v.user + '…' : 'Skipping authentication…',
      'Handing message to the server…'
    ];
    var i = 0, timer;
    function next() {
      if (i < steps.length) { onStep(steps[i++]); timer = setTimeout(next, 420); return; }
      if (v.host === 'localhost') return done(false, 'Connection refused - nothing is listening on localhost:' + v.port + ' (simulated)');
      if (v.user && v.pass.length < 8) return done(false, '535 Authentication failed - password too short for the simulated server');
      done(true, '250 Message accepted for delivery (simulated - no email was sent)');
    }
    next();
    return function () { clearTimeout(timer); };
  }

  /* Export the whole store as JSON.
     A plain <a download> works when the app is served normally, but is inert
     inside the Artifact viewer's sandbox - there the host mediates saving
     through the downloads capability. Try that first, fall back to the link,
     and if neither can deliver a file, show the JSON so it can be copied. */
  function exportData() {
    var json = JSON.stringify(S.state, null, 2);
    var d = new Date();
    var name = 'aurafit-export-' + d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0') + '.json';

    function viaLink() {
      try {
        var blob = new Blob([json], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        U.toast('Export download started', 'success');
        return true;
      } catch (e) { return false; }
    }

    function viaClipboard() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(function () {
          U.toast('Export copied to the clipboard', 'success');
        }, function () {
          U.toast('Could not export on this device.', 'error');
        });
      } else {
        U.toast('Could not export on this device.', 'error');
      }
    }

    if (w.claude && typeof w.claude.use === 'function') {
      w.claude.use('downloads').then(function (dl) {
        if (dl && dl.save) {
          dl.save({ filename: name, data: json }).then(function () {
            U.toast('Export saved', 'success');
          }, function () {
            if (!viaLink()) viaClipboard();
          });
        } else if (!viaLink()) {
          viaClipboard();
        }
      }, function () { if (!viaLink()) viaClipboard(); });
    } else if (!viaLink()) {
      viaClipboard();
    }

    return json.length;
  }

  Screens.adminSettings = guarded({
    shell: true,
    tab: 'account',
    topbar: topbar('App settings'),

    render: function () {
      var st = settings();
      var bytes = storageBytes();
      return '' +
      nav('adminSettings') +
      '<div class="sec"><div class="sec__head"><div class="sec__title">Sign-in setup</div></div>' +
        '<div class="card card--pad"><p class="t-sm">Signed in as <strong>' + U.esc(me().email) + '</strong>. Manage local accounts and passwords here.</p>' +
        '<div class="adm-actions"><button class="btn btn--ghost" data-go="#/admin/users">Manage login accounts</button>' +
        '<button class="btn btn--primary" data-own-password>Change my password</button></div>' +
        '<p class="adm-hint">Email and password sign-in works on this browser. Google sign-in, email verification and password recovery require a connected authentication backend; SMTP presets do not enable them.</p></div></div>' +

      '<div class="adm-two">' +
        '<div class="sec">' +
          '<div class="sec__head"><div class="sec__title">General</div></div>' +
          '<div class="card card--pad">' +
            '<form data-general novalidate>' +
              field({ id: 'set-appname', label: 'App name', val: st.appName, ph: 'Aura Fit', ico: 'i-hanger', hint: 'Used in email templates as {{app_name}}.' }) +
              field({ id: 'set-support', label: 'Support email', val: st.supportEmail, ph: 'support@aurafit.app', type: 'email', ico: 'i-mail', hint: 'Used in email templates as {{support_email}}.' }) +
              '<div class="adm-actions">' +
                '<button type="submit" class="btn btn--primary">' + U.icon('i-check', 'ico--sm') + '<span>Save changes</span></button>' +
              '</div>' +
            '</form>' +
          '</div>' +
        '</div>' +

        '<div class="sec">' +
          '<div class="sec__head"><div class="sec__title">Access</div><span class="sec__link">Saved instantly</span></div>' +
          '<div class="card">' + TOGGLES.map(function (t) { return toggleRow(t, !!st[t.id]); }).join('') + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="sec__head"><div class="sec__title adm-danger__title">' + U.icon('i-a-alert') + 'Danger zone</div></div>' +
        '<div class="card adm-danger">' +
          '<div class="adm-danger__row">' +
            '<span class="grow">' +
              '<span class="adm-danger__t">Export all data</span>' +
              '<span class="adm-danger__s">Download everything Aura Fit keeps in this browser (' + fmtBytes(bytes) + ') as a JSON file - accounts, wardrobe, outfits and settings. Includes local passwords; keep the file private.</span>' +
            '</span>' +
            '<button class="btn btn--ghost btn--sm" data-export>' + U.icon('i-a-download', 'ico--sm') + '<span>Export JSON</span></button>' +
          '</div>' +
          '<div class="adm-danger__row">' +
            '<span class="grow">' +
              '<span class="adm-danger__t">Reset all app data</span>' +
              '<span class="adm-danger__s">Deletes every account, wardrobe item, outfit and setting on this device and signs you out. There is no undo.</span>' +
            '</span>' +
            '<button class="btn btn--danger btn--sm" data-reset-all>' + U.icon('i-trash', 'ico--sm') + '<span>Reset everything</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
    },

    mount: function (view) {
      U.$('[data-general]', view).addEventListener('submit', function (e) {
        e.preventDefault();
        clearErrs(view);
        var name = val(view, 'set-appname'), sup = val(view, 'set-support').toLowerCase();
        var errs = {};
        if (name.length < 2) errs['set-appname'] = 'App name must be at least 2 characters.';
        else if (name.length > 40) errs['set-appname'] = 'Keep the app name under 40 characters.';
        if (!sup) errs['set-support'] = 'Support email is required.';
        else if (!validEmail(sup)) errs['set-support'] = 'Enter a valid email address.';
        if (!applyErrs(view, errs)) return U.toast('Please fix the highlighted fields.', 'error');
        if (!attempt(function () { saveSettings({ appName: name, supportEmail: sup }); })) return;
        markSaved(view);
        U.toast('Settings saved', 'success');
      });
      U.on(view, 'input', '.input', function (e, t) { t.closest('.field').classList.remove('has-err'); });
      U.on(view, 'click', '[data-own-password]', function () { openPassword(me().email); });

      U.on(view, 'click', '[data-toggle]', function (e, t) {
        var id = t.dataset.toggle, on = !t.classList.contains('is-on');
        var patch = {}; patch[id] = on;
        if (!attempt(function () { saveSettings(patch); })) return;
        t.classList.toggle('is-on', on);
        t.setAttribute('aria-checked', on ? 'true' : 'false');
        var label = null;
        TOGGLES.forEach(function (x) { if (x.id === id) label = x.label; });
        U.toast(label + (on ? ' enabled' : ' disabled'), 'success');
      });

      U.on(view, 'click', '[data-export]', function () {
        try {
          exportData();
        } catch (err) {
          U.toast('Export failed in this browser.', 'error');
        }
      });

      U.on(view, 'click', '[data-reset-all]', function () {
        U.confirmDialog({
          title: 'Reset all app data?',
          text: 'Every account, wardrobe item, outfit, saved product and setting on this device will be deleted. You will be signed out. This cannot be undone.',
          ok: 'Delete everything', danger: true
        }).then(function (yes) {
          if (!yes) return;
          var theme = S.state.theme;
          if (!attempt(function () { S.resetAll(); })) return;
          attempt(function () { S.state.theme = theme; S.save(); });
          U.toast('All app data has been reset', 'success');
          w.Router.go('#/login');
        });
      });
    }
  });

  /* ==========================================================
     EXPORT
     ========================================================== */
  w.Admin = {
    isAdmin: isAdmin,
    isAdminEmail: isAdminEmail,
    store: store,
    nav: nav
  };

  if (document.body) injectIcons();
  else document.addEventListener('DOMContentLoaded', injectIcons);
})(window);


/* ===== js/router.js ===== */
/* ==========================================================
   AURA FIT - ROUTER + APP SHELL
   Hash routing, shell construction (sidebar / topbar / tab bar
   / floating "+"), and view lifecycle.
   ========================================================== */
(function (w) {
  'use strict';
  var U = w.UI, S = w.Store;

  /* four main sections - the "+" is deliberately NOT one of them */
  var TABS = [
    { id: 'home',     label: 'Home',     icon: 'i-home',    href: '#/home' },
    { id: 'wardrobe', label: 'Wardrobe', icon: 'i-hanger',  href: '#/wardrobe' },
    { id: 'ideas',    label: 'AI Ideas', icon: 'i-sparkle', href: '#/ideas' },
    { id: 'account',  label: 'Account',  icon: 'i-user',    href: '#/account' }
  ];

  var ROUTES = [
    { re: /^\/?$/,               screen: 'home' },
    { re: /^\/start$/,           screen: 'start' },
    { re: /^\/login$/,           screen: 'login' },
    { re: /^\/signup$/,          screen: 'signup' },
    { re: /^\/forgot$/,          screen: 'forgot' },
    { re: /^\/check-email$/,     screen: 'checkEmail' },
    { re: /^\/reset$/,           screen: 'reset' },
    { re: /^\/password-updated$/,screen: 'passwordUpdated' },
    { re: /^\/welcome$/,         screen: 'welcome' },
    { re: /^\/gender$/,          screen: 'gender' },
    { re: /^\/onboarding$/,      screen: 'onboarding' },
    { re: /^\/home$/,            screen: 'home' },
    { re: /^\/wardrobe$/,        screen: 'wardrobe' },
    { re: /^\/wardrobe\/(.+)$/,  screen: 'wardrobe', keys: ['cat'] },
    { re: /^\/item\/(.+)$/,      screen: 'item',     keys: ['id'] },
    { re: /^\/outfit\/(.+)$/,    screen: 'outfit',   keys: ['id'] },
    { re: /^\/add$/,             screen: 'add' },
    { re: /^\/ideas$/,           screen: 'ideas' },
    { re: /^\/account$/,         screen: 'account' },
    { re: /^\/stats$/,           screen: 'stats' },
    { re: /^\/admin$/,           screen: 'adminDashboard' },
    { re: /^\/admin\/users$/,    screen: 'adminUsers' },
    { re: /^\/admin\/smtp$/,     screen: 'adminSmtp' },
    { re: /^\/admin\/emails$/,   screen: 'adminEmails' },
    { re: /^\/admin\/settings$/, screen: 'adminSettings' }
  ];

  /* reachable while signed out */
  var PUBLIC = ['start', 'login', 'signup', 'forgot', 'checkEmail', 'reset', 'passwordUpdated'];
  /* reachable while signed in but before the one-time setup is done */
  var PRE_ONBOARD = ['gender', 'onboarding', 'welcome'];
  /* admin-only */
  var ADMIN = ['adminDashboard', 'adminUsers', 'adminSmtp', 'adminEmails', 'adminSettings'];

  var shellBuilt = false;
  var rendered = null;      // the hash we last actually painted
  var active = null;        // screen currently mounted, for teardown
  var trail = [];          // only destinations visited inside this app
  var goingBack = false;
  var leavePrompt = false;

  function decode(value) {
    try { return decodeURIComponent(value.replace(/\+/g, ' ')); }
    catch (e) { return value; }
  }

  function parse() {
    var h = location.hash.replace(/^#/, '') || '/home';
    var qi = h.indexOf('?');
    var path = qi >= 0 ? h.slice(0, qi) : h;
    var qs = qi >= 0 ? h.slice(qi + 1) : '';
    var params = {};
    qs.split('&').forEach(function (kv) {
      if (!kv) return;
      var equals = kv.indexOf('=');
      var key = equals < 0 ? kv : kv.slice(0, equals);
      params[decode(key)] = decode(equals < 0 ? '' : kv.slice(equals + 1));
    });

    for (var i = 0; i < ROUTES.length; i++) {
      var m = path.match(ROUTES[i].re);
      if (m) {
        (ROUTES[i].keys || []).forEach(function (k, idx) { params[k] = decode(m[idx + 1]); });
        return { screen: ROUTES[i].screen, params: params, path: path };
      }
    }
    return { screen: 'home', params: params, path: path };
  }

  /* ---------------- shell ---------------- */
  function buildShell() {
    var root = U.$('#root');
    root.innerHTML =
      '<a class="skip-link" href="#main-content" data-skip-main>Skip to main content</a><div class="app">' +
        '<aside class="sidebar">' +
          '<div class="sidebar__brand">' +
            '<span class="brand__mark">' + U.icon('i-hanger') + '</span>' +
            '<span class="brand__name">Aura<em>Fit</em></span>' +
          '</div>' +
          '<nav class="sidebar__nav" aria-label="Main navigation">' +
            '<div class="sidebar__lbl">Menu</div>' +
            TABS.map(function (t) {
              return '<button class="sidebar__btn" data-tab="' + t.id + '" data-go="' + t.href + '">' +
                U.icon(t.icon) + '<span>' + t.label + '</span></button>';
            }).join('') +
            '<div class="sidebar__lbl">Library</div>' +
            '<button class="sidebar__btn" data-go="#/wardrobe?mode=outfits">' + U.icon('i-grid') + '<span>My outfits</span></button>' +
            '<button class="sidebar__btn" data-go="#/stats">' + U.icon('i-sliders') + '<span>Wardrobe stats</span></button>' +
          '</nav>' +
          '<div class="sidebar__foot">' +
            '<button class="sidebar__user" data-go="#/account">' +
              '<span class="sidebar__avatar" data-avatar>A</span>' +
              '<span class="grow" style="min-width:0">' +
                '<span class="t-sm t-med trunc" style="display:block" data-uname>Guest</span>' +
                '<span class="t-xs t-faint trunc" style="display:block" data-uemail></span>' +
              '</span>' +
            '</button>' +
          '</div>' +
        '</aside>' +

        '<div class="main">' +
          '<header class="topbar">' +
            '<div class="topbar__side topbar__side--l" data-tb-left></div>' +
            '<div class="topbar__title" data-tb-title></div>' +
            '<div class="topbar__side topbar__side--r" data-tb-right></div>' +
          '</header>' +
          '<main class="view" id="main-content" tabindex="-1" data-view></main>' +
        '</div>' +

        '<nav class="tabbar" aria-label="Main navigation">' + TABS.map(function (t) {
          return '<button class="tabbar__btn" data-tab="' + t.id + '" data-go="' + t.href + '">' +
            U.icon(t.icon) + '<span>' + t.label + '</span></button>';
        }).join('') + '</nav>' +

        /* floating "+" - bottom RIGHT, above the tab bar, like a support bubble */
        '<button class="fab" data-go="#/add" aria-label="Add item">' +
          U.icon('i-plus') + '<span class="fab__label">Add item</span>' +
        '</button>' +
      '</div>';
    shellBuilt = true;
  }

  function paintTopbar(cfg) {
    var l = U.$('[data-tb-left]'), t = U.$('[data-tb-title]'), r = U.$('[data-tb-right]');
    var left = cfg.left || '';
    if (cfg.back) {
      left = '<button class="iconbtn" data-back aria-label="Go back">' + U.icon('i-left') + '</button>' + left;
    }
    l.innerHTML = left;
    t.textContent = cfg.title || '';
    r.innerHTML = cfg.right || '';
  }

  function paintUser() {
    var u = S.user();
    var av = U.$('[data-avatar]'), n = U.$('[data-uname]'), e = U.$('[data-uemail]');
    if (!av) return;
    av.textContent = U.initials(u ? u.name : 'A');
    n.textContent = u ? u.name : 'Guest';
    e.textContent = u ? u.email : '';
  }

  function setActiveTab(id) {
    /* scoped so it cannot clash with .tab[data-tab] inside a screen or sheet */
    U.$$('.tabbar [data-tab], .sidebar [data-tab]').forEach(function (b) {
      b.classList.toggle('is-active', b.dataset.tab === id);
      b.setAttribute('aria-current', b.dataset.tab === id ? 'page' : 'false');
    });
  }

  /* ---------------- render ---------------- */

  /* rewrite the hash without bouncing back through hashchange */
  function redirect(hash) {
    location.replace(location.pathname + location.search + hash);
  }

  function render(depth) {
    depth = depth || 0;
    var route = parse();
    var screen = w.Screens[route.screen];

    /* resolve guards before painting, so no stale frame is ever shown */
    if (depth < 5) {
      var authed = !!S.user();
      var target = null;

      if (!screen) target = '#/home';
      else if (!authed && PUBLIC.indexOf(route.screen) < 0) target = '#/start';
      else if (authed && PUBLIC.indexOf(route.screen) >= 0) target = '#/home';
      else if (authed && route.screen !== 'gender' && ['male', 'female'].indexOf(S.user().gender) < 0) target = '#/gender';
      else if (authed && PRE_ONBOARD.indexOf(route.screen) < 0 && !S.user().onboarded) target = '#/onboarding';
      else if (authed && ADMIN.indexOf(route.screen) >= 0 &&
               !(w.Admin && w.Admin.isAdmin && w.Admin.isAdmin())) target = '#/account';

      if (target) { redirect(target); return render(depth + 1); }
    }
    if (!screen) return;

    var changedRoute = rendered !== location.hash;
    if (goingBack) trail.pop();
    if (!goingBack && rendered && changedRoute) {
      if (trail.length && trail[trail.length - 1] === location.hash) trail.pop();
      else trail.push(rendered);
    }
    if (!S.user()) trail = [];
    goingBack = false;
    rendered = location.hash;

    /* let the outgoing screen release timers and listeners */
    if (active && active.unmount) { try { active.unmount(); } catch (e) { console.error(e); } }
    active = screen;

    var root = U.$('#root');
    if (U.closeDialogs) U.closeDialogs();
    U.Sheet.close(true);

    if (screen.shell === false) {
      shellBuilt = false;
      root.innerHTML = '';
      var node = U.el(screen.render(route.params));
      root.appendChild(node);
      if (screen.mount) screen.mount(root.firstElementChild, route.params);
      window.scrollTo(0, 0);
      w.App.syncThemeButtons();
      return;
    }

    if (!shellBuilt) buildShell();
    paintUser();

    var cfg = screen.topbar ? screen.topbar(route.params) : { title: '' };
    document.title = (cfg.title || 'Your wardrobe') + ' · Aura Fit';
    paintTopbar(cfg);
    setActiveTab(screen.tab || '');

    var oldView = U.$('[data-view]');
    var view = oldView.cloneNode(false);
    oldView.replaceWith(view);
    view.innerHTML = screen.render(route.params);
    if (screen.mount) screen.mount(view, route.params);
    if (view.setAttribute) {
      view.setAttribute('aria-label', cfg.title || 'Aura Fit');
      if (changedRoute && view.focus) view.focus({ preventScroll: true });
    }

    /* hide the "+" on the screen it opens */
    var fab = U.$('.fab');
    if (fab) {
      var createOutfit = route.screen === 'wardrobe' && route.params.mode === 'outfits';
      var fabLabel = createOutfit ? 'Create outfit' : 'Add item';
      var hideFab = ['add', 'item', 'outfit'].indexOf(route.screen) >= 0;
      fab.classList.toggle('is-hidden', hideFab);
      fab.hidden = hideFab;
      fab.setAttribute('data-go', createOutfit ? '#/add?mode=outfit' : '#/add');
      fab.setAttribute('aria-label', fabLabel);
      var label = fab.querySelector('.fab__label');
      if (label) label.textContent = fabLabel;
    }

    window.scrollTo(0, 0);
    U.stickyTopbar();
    w.App.syncThemeButtons();
  }

  function go(hash, replace, discard) {
    var target = hash.charAt(0) === '#' ? hash : '#' + hash;
    if (!discard && active && active.hasUnsavedChanges && active.hasUnsavedChanges()) {
      if (leavePrompt) return;
      leavePrompt = true;
      U.confirmDialog({ title: 'Discard unsaved changes?', text: 'Your changes have not been saved yet.', ok: 'Discard changes', cancel: 'Keep editing', danger: true })
        .then(function (yes) { leavePrompt = false; if (yes) go(target, replace, true); else goingBack = false; });
      return;
    }
    if (location.hash === target) { render(); return; }   // same route -> repaint
    if (replace) redirect(target);
    else location.hash = target;
    render();
  }

  function refresh() { render(); }

  function back() {
    while (trail.length && S.user() && /^#\/(add|login|signup|start|welcome|gender)(?:\?|$)/.test(trail[trail.length - 1])) trail.pop();
    var previous = trail[trail.length - 1];
    var route = parse();
    var fallback = route.screen === 'login' || route.screen === 'signup' ? '#/start' :
      route.screen === 'forgot' ? '#/login' :
      route.screen === 'outfit' ? '#/wardrobe?mode=outfits' :
      route.screen === 'item' || route.screen === 'add' ? '#/wardrobe' : '#/home';
    // Browser history may belong to a different site after a direct deep link.
    goingBack = true;
    go(previous || fallback, true);
  }

  /* Rewrite the address bar for in-place filtering without re-rendering.
     Keeps `rendered` in step so the next hashchange is judged correctly. */
  function syncHash(hash) {
    var target = hash.charAt(0) === '#' ? hash : '#' + hash;
    if (location.hash === target) return;
    history.replaceState(null, '', location.pathname + location.search + target);
    rendered = target;
  }

  window.addEventListener('hashchange', function () {
    if (location.hash === rendered) return;                // already painted this route
    if (active && active.hasUnsavedChanges && active.hasUnsavedChanges()) {
      var target = location.hash;
      history.replaceState(null, '', location.pathname + location.search + rendered);
      go(target, true);
      return;
    }
    render();
  });

  w.Router = { render: render, go: go, back: back, refresh: refresh, syncHash: syncHash, parse: parse, TABS: TABS };
})(window);


/* ===== js/app.js ===== */
/* ==========================================================
   AURA FIT - BOOTSTRAP
   ========================================================== */
(function (w) {
  'use strict';
  var U = w.UI, S = w.Store;

  function splash() {
    var node = U.el(
      '<div class="splash">' +
        '<div class="splash__mark">' + U.icon('i-hanger', 'ico--xl') + '</div>' +
        '<div class="splash__name">Aura<em>Fit</em></div>' +
        '<div class="splash__tag">Your wardrobe, styled by AI.</div>' +
      '</div>');
    document.body.appendChild(node);
    setTimeout(function () {
      node.classList.add('is-out');
      setTimeout(function () { node.remove(); }, 460);
    }, 900);
  }

  /* keep every theme button in sync with the active theme */
  function syncThemeButtons() {
    var dark = S.effectiveTheme() === 'dark';
    U.$$('[data-theme-toggle]').forEach(function (b) {
      b.innerHTML = U.icon(dark ? 'i-sun' : 'i-moon');
      b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    });
  }

  function init() {
    S.load();
    S.applyTheme();
    splash();

    /* ---- global delegated handlers ---- */
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-skip-main]')) {
        e.preventDefault();
        var content = document.getElementById('main-content');
        if (content) content.focus();
        return;
      }
      var go = e.target.closest('[data-go]');
      if (go) {
        e.preventDefault();
        w.Router.go(go.dataset.go);
        return;
      }
      var back = e.target.closest('[data-back]');
      if (back) {
        e.preventDefault();
        w.Router.back();
        return;
      }
      var th = e.target.closest('[data-theme-toggle]');
      if (th) {
        e.preventDefault();
        var t = S.toggleTheme();
        syncThemeButtons();
        U.toast(t === 'dark' ? 'Dark mode on' : 'Light mode on', 'success');
      }
    });

    /* follow the OS while the user has not made an explicit choice */
    if (w.matchMedia) {
      var mq = w.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function () {
        if (!S.state.theme) { S.applyTheme(); syncThemeButtons(); }
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }

    if (!location.hash) location.replace(location.pathname + location.search + '#/home');
    w.Router.render();
  }

  w.App = { init: init, syncThemeButtons: syncThemeButtons };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(window);

</script>
