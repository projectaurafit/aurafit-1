/* ===== css/tokens.css ===== */
/* ============================================================
   AURA FIT - DESIGN TOKENS
   Colours sampled directly from the Design/ reference kit.
   Primitive -> semantic. Never hard-code a hex outside this file.
   ============================================================ */

:root{
  /* ---- type ---- */
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --fs-display: 26px;
  --fs-title:   22px;
  --fs-h2:      17px;
  --fs-h3:      15px;
  --fs-body:    14px;
  --fs-sm:      13px;
  --fs-xs:      12px;
  --fs-xxs:     12px;

  --lh-tight: 1.2;
  --lh-snug:  1.35;
  --lh-body:  1.55;

  /* ---- spacing (4pt grid) ---- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:32px; --s8:40px; --s9:56px;

  /* ---- radius ---- */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-full:999px;

  /* ---- motion ---- */
  --ease-out:    cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.4,.5,1);
  --t-fast:130ms; --t-base:240ms; --t-slow:420ms;

  /* ---- layout ---- */
  --tabbar-h: 68px;
  --topbar-h: 60px;
  --sidebar-w: 250px;
  --content-max: 1160px;
  --safe-b: env(safe-area-inset-bottom, 0px);

  /* ---- constant surfaces (identical in both themes) ---- */
  --hero-bg:     #15120F;   /* the always-dark wardrobe photo panel */
  --hero-text:   #F6EFE8;
  --hero-text-2: #C9BEB4;
  --on-solid:    #FFFFFF;   /* text/icons on a saturated fill */
  --plate-chip:    rgba(255,255,255,.88);  /* control resting on a product plate */
  --plate-chip-fg: #6B6058;
  --plate-chip-bd: rgba(24,18,14,.10);

  /* ---- z-index ---- */
  --z-nav:40; --z-fab:50; --z-sheet:80; --z-modal:90; --z-toast:95;
}

/* ============================ LIGHT ============================ */
:root, html[data-theme="light"]{
  --bg:            #FBF7F4;
  --bg-grad:       radial-gradient(1100px 500px at 80% -10%, #FBEFE7 0%, rgba(251,247,244,0) 60%);
  --surface:       #FFFFFF;
  --surface-2:     #F7F3EF;
  --surface-3:     #F1EBE5;
  --surface-tint:  #F7EAE2;
  --surface-tint-2:#FBF1EA;

  --border:        #EDE4DC;
  --border-2:      #E0D5CB;
  --divider:       #F0E9E3;

  --text:          #1C1917;
  --text-2:        #695F58;
  --text-3:        #74685F;

  --accent:        #E4A87F;
  --accent-2:      #C9865A;
  --accent-text:   #9A5A32;
  --accent-soft:   #F8EBE1;
  --accent-ring:   rgba(228,168,127,.38);
  --focus:         #9A5A32;
  --on-accent:     #2C2019;

  /* strong action = near-black in light (per reference kit) */
  --primary:       #1C1917;
  --on-primary:    #FFF9F5;

  --danger:        #B13F35;
  --danger-soft:   #FBECEA;
  --success:       #36734D;
  --success-soft:  #EAF3ED;

  --scrim:         rgba(38,30,25,.44);

  --knob:          #FFFFFF;
  --plate:         #F4EFEA;
  --plate-2:       #E9E1D9;

  --sh-card:   0 1px 2px rgba(60,44,34,.05);
  --sh-raised: 0 6px 20px rgba(60,44,34,.08);
  --sh-sheet:  0 -14px 44px rgba(50,36,28,.16);
  --sh-fab:    0 8px 22px rgba(190,132,88,.34);
  --sh-pop:    0 12px 32px rgba(50,36,28,.14);

  color-scheme: light;
}

/* ============================ DARK ============================= */
html[data-theme="dark"]{
  --bg:            #111312;
  --bg-grad:       radial-gradient(1100px 500px at 80% -10%, #221D19 0%, rgba(17,19,18,0) 60%);
  --surface:       #1B1C1E;
  --surface-2:     #212322;
  --surface-3:     #272928;
  --surface-tint:  #37302A;
  --surface-tint-2:#2B2622;

  --border:        #2A2C2B;
  --border-2:      #383A39;
  --divider:       #242625;

  --text:          #F3F1EF;
  --text-2:        #9C9895;
  --text-3:        #A39B95;

  --accent:        #ECB99E;
  --accent-2:      #ECB99E;
  --accent-text:   #ECB99E;
  --accent-soft:   #37302A;
  --accent-ring:   rgba(236,185,158,.34);
  --focus:         #ECB99E;
  --on-accent:     #1F1814;

  /* strong action = peach in dark (per reference kit) */
  --primary:       #ECB99E;
  --on-primary:    #1F1814;

  --danger:        #E8837A;
  --danger-soft:   #3A2523;
  --success:       #7FBE9B;
  --success-soft:  #1E2E26;

  --scrim:         rgba(0,0,0,.62);

  --knob:          #FFFFFF;
  --plate:         #EFE9E3;
  --plate-2:       #DFD7CF;

  --sh-card:   0 1px 2px rgba(0,0,0,.3);
  --sh-raised: 0 6px 20px rgba(0,0,0,.4);
  --sh-sheet:  0 -14px 44px rgba(0,0,0,.55);
  --sh-fab:    0 8px 22px rgba(0,0,0,.5);
  --sh-pop:    0 12px 32px rgba(0,0,0,.5);

  color-scheme: dark;
}


/* ===== css/base.css ===== */
/* ================= RESET + BASE ================= */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--font);
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  color:var(--text);
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
  transition:background-color var(--t-base) var(--ease-out), color var(--t-base) var(--ease-out);
}

img,svg,video{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:not-allowed}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}

h1,h2,h3,h4{line-height:var(--lh-tight);font-weight:700;letter-spacing:-.02em}

::selection{background:var(--accent);color:var(--on-accent)}

:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
:focus:not(:focus-visible){outline:none}

.skip-link{position:fixed;left:var(--s4);top:var(--s4);z-index:10000;
  padding:var(--s3) var(--s4);background:var(--primary);color:var(--on-primary);
  border-radius:var(--r-sm);transform:translateY(-200%)}
.skip-link:focus{transform:none}
[data-view]:focus{outline:none}
h1,h2,h3{scroll-margin-top:calc(var(--topbar-h) + var(--s4))}

/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ================= ICON ================= */
.ico{
  width:20px;height:20px;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.ico--fill{fill:currentColor;stroke:none}
.ico--sm{width:16px;height:16px}
.ico--lg{width:24px;height:24px}
.ico--xl{width:32px;height:32px;stroke-width:1.4}

/* ================= UTILITIES ================= */
.af-row{display:flex;align-items:center}
.row-b{display:flex;align-items:center;justify-content:space-between}
.af-col{display:flex;flex-direction:column}
.gap1{gap:var(--s1)}.gap2{gap:var(--s2)}.gap3{gap:var(--s3)}.gap4{gap:var(--s4)}
.grow{flex:1;min-width:0}
.center{display:flex;align-items:center;justify-content:center}
.hidden{display:none !important}
[hidden]{display:none !important}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

.t-dim{color:var(--text-2)}
.t-faint{color:var(--text-3)}
.t-accent{color:var(--accent-text)}
.t-xs{font-size:var(--fs-xs)}
.t-sm{font-size:var(--fs-sm)}
.t-med{font-weight:600}
.t-bold{font-weight:700}
.t-right{text-align:right}
.t-center{text-align:center}

.scroll-x{
  display:flex;overflow-x:auto;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.scroll-x::-webkit-scrollbar{display:none}

/* section heading */
.sec{margin-top:var(--s6)}
.sec__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.sec__title{font-size:var(--fs-h2);font-weight:700;letter-spacing:-.015em}
.sec__link{
  display:inline-flex;align-items:center;gap:2px;min-height:44px;flex:none;
  font-size:var(--fs-xs);font-weight:600;color:var(--text-2);
  transition:color var(--t-fast);
}
.sec__link:hover{color:var(--accent-text)}
.sec__link .ico{width:14px;height:14px}

/* ================= ANIMATION ================= */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

.anim-in{animation:fadeUp var(--t-slow) var(--ease-out) both}
.stagger>*{animation:fadeUp 460ms var(--ease-out) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.10s}
.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}
.stagger>*:nth-child(6){animation-delay:.22s}
.stagger>*:nth-child(7){animation-delay:.26s}
.stagger>*:nth-child(8){animation-delay:.30s}
.stagger>*:nth-child(n+9){animation-delay:.34s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}


/* ===== css/components.css ===== */
/* ==========================================================
   AURA FIT - COMPONENTS
   ========================================================== */

/* ---------------- BUTTONS ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:48px;height:auto;padding:10px var(--s5);
  border-radius:var(--r-full);
  font-size:var(--fs-h3);font-weight:600;letter-spacing:-.01em;
  border:1px solid transparent;
  transition:transform var(--t-fast) var(--ease-out),
             background-color var(--t-fast), border-color var(--t-fast),
             opacity var(--t-fast), box-shadow var(--t-fast);
  user-select:none;white-space:normal;text-align:center;overflow-wrap:anywhere;
}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn.is-disabled{opacity:.45;pointer-events:none}

.btn--primary{background:var(--primary);color:var(--on-primary)}
.btn--primary:hover{filter:brightness(1.08)}

.btn--accent{background:var(--accent);color:var(--on-accent)}
.btn--accent:hover{filter:brightness(1.06)}

.btn--soft{background:var(--surface-tint);color:var(--text)}
.btn--soft:hover{background:var(--surface-3)}

.btn--ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn--ghost:hover{border-color:var(--border-2);background:var(--surface-2)}

.btn--quiet{background:transparent;color:var(--text-2)}
.btn--quiet:hover{background:var(--surface-2);color:var(--text)}

.btn--danger{background:var(--danger-soft);color:var(--danger)}
.btn--danger:hover{filter:brightness(.97)}

.btn--block{width:100%}
.btn--sm{min-height:44px;padding:8px var(--s4);font-size:var(--fs-sm)}
.btn--lg{min-height:54px;font-size:var(--fs-h2)}

/* icon button */
.iconbtn{
  width:44px;height:44px;flex:none;border-radius:var(--r-full);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text);
  transition:background-color var(--t-fast),color var(--t-fast),transform var(--t-fast);
}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.92)}
.iconbtn--bordered{background:var(--surface);border:1px solid var(--border)}
.iconbtn--bordered:hover{border-color:var(--border-2)}
.iconbtn--badge{position:relative}
.iconbtn--badge::after{
  content:"";position:absolute;top:8px;right:9px;
  width:7px;height:7px;border-radius:99px;background:var(--danger);
  box-shadow:0 0 0 2px var(--bg);
}

/* ---------------- CHIPS / TABS ---------------- */
.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{
  min-height:44px;padding:8px var(--s4);border-radius:var(--r-full);
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:var(--fs-sm);font-weight:600;
  background:var(--surface);color:var(--text-2);
  border:1px solid var(--border);
  transition:all var(--t-fast) var(--ease-out);
}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip.is-active{
  background:var(--primary);color:var(--on-primary);border-color:transparent;
}
.chip .ico{width:15px;height:15px}

/* underline tabs */
.tabs{
  display:flex;gap:var(--s3);border-bottom:1px solid var(--divider);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:none;padding:var(--s3) 10px;min-width:44px;
  font-size:var(--fs-h3);font-weight:600;color:var(--text-2);
  transition:color var(--t-fast);
}
.tab:hover{color:var(--text-2)}
.tab.is-active{color:var(--text)}
.tab.is-active::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  border-radius:2px;background:var(--accent);
  animation:fadeIn var(--t-fast) var(--ease-out);
}

/* ---------------- CARD ---------------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--sh-card);
  transition:border-color var(--t-fast), box-shadow var(--t-base), transform var(--t-base);
}
.card--pad{padding:var(--s4)}
.card--tint{background:var(--surface-tint);border-color:transparent}
.card--hover:hover{border-color:var(--border-2);box-shadow:var(--sh-raised);transform:translateY(-2px)}
.card--flat{box-shadow:none}

/* list row inside cards */
.listrow{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s4);width:100%;text-align:left;
  transition:background-color var(--t-fast);
}
.listrow+.listrow{border-top:1px solid var(--divider)}
.listrow:first-child{border-radius:var(--r-md) var(--r-md) 0 0}
.listrow:last-child{border-radius:0 0 var(--r-md) var(--r-md)}
.listrow:hover{background:var(--surface-2)}
.listrow__ico{
  width:38px;height:38px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-tint);color:var(--accent-2);
}
.listrow__t{font-size:var(--fs-h3);font-weight:600}
.listrow__s{font-size:var(--fs-xs);color:var(--text-2);margin-top:1px}
.listrow__chev{color:var(--text-3)}

/* ---------------- FORM ---------------- */
.field{margin-bottom:var(--s4)}
.field__label{
  display:block;font-size:var(--fs-sm);font-weight:600;
  color:var(--text-2);margin-bottom:var(--s2);
}
.input,.select,.textarea{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:0 var(--s4);height:50px;
  font-size:16px;color:var(--text);
  transition:border-color var(--t-fast), box-shadow var(--t-fast), background-color var(--t-fast);
  appearance:none;
}
.textarea{height:auto;min-height:96px;padding:var(--s3) var(--s4);resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-ring);
}
.select{
  padding-right:var(--s8);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px, calc(100% - 14px) 22px;
  background-size:6px 6px, 6px 6px;
  background-repeat:no-repeat;
  color:var(--text);
}
.select option{background:var(--surface);color:var(--text)}

.input-wrap{position:relative}
.input-wrap .input{padding-left:46px}
.input-wrap:has(.input-wrap__act) .input{padding-right:54px}
.input-wrap__ico{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;
}
.input-wrap__act{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:99px;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;
}
.input-wrap__act:hover{color:var(--text);background:var(--surface-2)}

.field__err{
  display:none;font-size:var(--fs-xs);color:var(--danger);margin-top:6px;font-weight:500;
}
.field.has-err .input,.field.has-err .select{border-color:var(--danger)}
.field.has-err .field__err{display:block;animation:fadeIn var(--t-fast)}

/* search bar */
.searchbar{
  display:flex;align-items:center;gap:var(--s3);
  height:48px;padding:0 var(--s4);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);
  transition:border-color var(--t-fast), box-shadow var(--t-fast);
}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.searchbar__ico{color:var(--text-3)}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.searchbar input::placeholder{color:var(--text-3)}

/* colour swatches */
.swatches{display:flex;gap:var(--s3);flex-wrap:wrap}
.swatch{
  width:44px;height:44px;border-radius:var(--r-full);
  border:2px solid var(--border);position:relative;
  transition:transform var(--t-fast) var(--ease-spring), box-shadow var(--t-fast);
}
.swatch:hover{transform:scale(1.08)}
.swatch.is-active{
  transform:scale(1.06);
  box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}
.swatch.is-active::after{
  content:"";position:absolute;inset:0;margin:auto;
  width:12px;height:7px;border-left:2px solid;border-bottom:2px solid;
  transform:rotate(-45deg) translate(1px,-2px);
  color:var(--swatch-check, var(--on-solid));
}

/* toggle switch */
.switch{
  width:48px;height:28px;border-radius:99px;flex:none;
  background:var(--border-2);position:relative;
  transition:background-color var(--t-base) var(--ease-out);
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:22px;height:22px;border-radius:99px;background:var(--knob);
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform var(--t-base) var(--ease-spring);
}
.switch.is-on{background:var(--accent)}
.switch.is-on::after{transform:translateX(20px)}

/* segmented control */
.segment{
  display:flex;padding:4px;gap:4px;
  background:var(--surface-2);border-radius:var(--r-full);
  border:1px solid var(--border);
}
.segment__btn{
  flex:1;min-width:0;min-height:44px;padding:8px;border-radius:var(--r-full);
  font-size:var(--fs-sm);font-weight:600;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all var(--t-base) var(--ease-out);
}
.segment__btn:hover{color:var(--text)}
.segment__btn.is-active{background:var(--surface);color:var(--text);box-shadow:var(--sh-card)}

/* ---------------- BADGE / PILL ---------------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  height:24px;padding:0 10px;border-radius:var(--r-full);
  font-size:var(--fs-xxs);font-weight:700;letter-spacing:.01em;
  background:var(--surface-tint);color:var(--accent-text);
}
.badge--muted{background:var(--surface-2);color:var(--text-2)}
.badge--success{background:var(--success-soft);color:var(--success)}
.badge .ico{width:12px;height:12px}
.badge .itemcard__dot{margin-right:0}

/* score pill */
.score{
  display:inline-flex;align-items:center;gap:4px;
  height:26px;padding:0 10px;border-radius:var(--r-full);
  font-size:var(--fs-xs);font-weight:700;
  background:var(--success-soft);color:var(--success);
}

/* ---------------- PRODUCT / GARMENT ---------------- */
.thumb{
  display:block;
  position:relative;width:100%;aspect-ratio:1/1;
  background:var(--plate);
  border-radius:var(--r-sm);overflow:hidden;
}
.thumb svg{width:100%;height:100%}
.thumb--tall{aspect-ratio:3/4}
.thumb--wide{aspect-ratio:4/3}

.prodcard{
  position:relative;display:flex;flex-direction:column;gap:var(--s2);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:var(--s2);
  text-align:left;width:100%;
  transition:border-color var(--t-fast),box-shadow var(--t-base),transform var(--t-base);
}
.prodcard:hover{border-color:var(--border-2);box-shadow:var(--sh-raised);transform:translateY(-2px)}
.prodcard__body{display:block;padding:0 var(--s2) var(--s2)}
.prodcard__name{display:block;font-size:var(--fs-sm);font-weight:600;line-height:1.3}
.prodcard__brand{display:block;font-size:var(--fs-xxs);color:var(--text-2);margin-top:2px}
.prodcard__price{display:block;font-size:var(--fs-h3);font-weight:700;margin-top:6px}
.prodcard__old{font-size:var(--fs-xxs);color:var(--text-3);text-decoration:line-through;margin-left:5px;font-weight:500}

/* selected state for the bottom-sheet single-select rule */
.prodcard.is-selected{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-ring);
}
.prodcard__tick{
  position:absolute;top:14px;right:14px;
  width:26px;height:26px;border-radius:99px;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.5);
  transition:opacity var(--t-fast),transform var(--t-fast) var(--ease-spring);
  z-index:2;
}
.prodcard.is-selected .prodcard__tick{opacity:1;transform:scale(1)}
.prodcard__tick .ico{width:14px;height:14px;stroke-width:2.6;flex:none}

/* heart on card */
.fav{
  position:absolute;top:12px;right:12px;z-index:2;
  width:44px;height:44px;border-radius:50%;
  background:var(--plate-chip);color:var(--plate-chip-fg);
  border:1px solid var(--plate-chip-bd);
  /* the glyph is centred by absolute positioning rather than flex:
     a round chip must never let its icon drift off the centre point */
  display:block;padding:0;line-height:0;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 2px 8px rgba(20,14,10,.14);
  transition:transform var(--t-fast) var(--ease-spring),color var(--t-fast),background-color var(--t-fast);
}
.fav:hover{transform:scale(1.06)}
.fav.is-on{color:var(--danger)}
.fav.is-on .ico{fill:currentColor}
/* Dead-centre regardless of flex quirks: the chip is the positioning
   context and the glyph is pinned to its exact middle. */
.fav .ico{
  position:absolute;top:50%;left:50%;
  width:17px;height:17px;
  transform:translate(-50%,-50%);
}


/* ---------------- BOTTOM SHEET ---------------- */
.sheet-scrim{
  position:fixed;inset:0;background:var(--scrim);
  z-index:var(--z-sheet);
  opacity:0;transition:opacity var(--t-base) var(--ease-out);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.sheet-scrim.is-open{opacity:1}

.sheet{
  position:fixed;left:0;right:0;bottom:0;
  z-index:calc(var(--z-sheet) + 1);
  height:66vh;                     /* ~2/3 of the screen, per spec */
  height:66dvh;
  max-height:none;
  background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--sh-sheet);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform var(--t-slow) var(--ease-spring);
  will-change:transform;
  border:1px solid var(--border);border-bottom:0;
}
.sheet.is-open{transform:translateY(0)}
.sheet.is-dragging{transition:none}

.sheet__grip{
  padding:10px 0 4px;display:flex;justify-content:center;
  cursor:grab;touch-action:none;flex:none;
}
.sheet__grip span{width:42px;height:4px;border-radius:99px;background:var(--border-2)}
.sheet__grip:active{cursor:grabbing}

.sheet__head{
  padding:var(--s2) var(--s5) var(--s3);flex:none;
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);
}
.sheet__title{font-size:var(--fs-h2);font-weight:700}
.sheet__head > div{min-width:0}
.sheet__title{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet__sub{font-size:var(--fs-xs);color:var(--text-2);margin-top:2px}

.sheet__tabs{padding:0 var(--s5);flex:none}
.sheet__body{
  flex:1;min-height:0;overflow-y:auto;padding:var(--s4) var(--s5) var(--s6);
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}

/* sticky action bar revealed on selection */
.sheet__bar{
  flex:none;padding:var(--s3) var(--s5) calc(var(--s3) + var(--safe-b));
  border-top:1px solid var(--divider);
  background:var(--surface);
  display:flex;align-items:center;gap:var(--s3);
  display:none;
  position:relative;
}
.sheet__bar.is-visible{
  display:flex;
  animation:fadeUp var(--t-base) var(--ease-spring) both;
}
.sheet__bar-info{flex:1;min-width:0}
.sheet__bar-name{font-size:var(--fs-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet__bar-price{font-size:var(--fs-xs);color:var(--text-2)}

/* ---------------- MODAL ---------------- */
.modal-scrim{
  position:fixed;inset:0;z-index:var(--z-modal);
  background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:var(--s5);opacity:0;transition:opacity var(--t-base);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.modal-scrim.is-open{opacity:1}
.modal{
  width:100%;max-width:380px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s6);box-shadow:var(--sh-pop);
  transform:scale(.94);opacity:0;
  transition:transform var(--t-base) var(--ease-spring),opacity var(--t-base);
}
.modal-scrim.is-open .modal{transform:scale(1);opacity:1}
.modal__title{font-size:var(--fs-h2);font-weight:700;margin-bottom:var(--s2)}
.modal__text{font-size:var(--fs-sm);color:var(--text-2);margin-bottom:var(--s5)}
.modal__acts{display:flex;gap:var(--s3)}
.modal__acts .btn{flex:1}

/* ---------------- TOAST ---------------- */
.toast-layer{
  position:fixed;left:0;right:0;z-index:var(--z-toast);
  bottom:calc(var(--tabbar-h) + var(--safe-b) + 84px);
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  pointer-events:none;padding:0 var(--s4);
}
.toast{
  display:flex;align-items:center;gap:var(--s2);
  max-width:420px;
  padding:11px var(--s4);border-radius:var(--r-full);
  background:var(--text);color:var(--bg);
  font-size:var(--fs-sm);font-weight:600;
  box-shadow:var(--sh-pop);
  animation:fadeUp var(--t-base) var(--ease-spring) both;
}
.toast.is-out{animation:fadeIn var(--t-fast) reverse both}
.toast .ico{width:16px;height:16px;display:block}
.toast [data-t-ico]{display:flex;align-items:center;flex:none}
.toast [data-t-msg]{min-width:0}
.toast--success .ico{color:var(--success)}
.toast--error .ico{color:var(--danger)}

/* ---------------- PROGRESS / DONUT ---------------- */
.donut{position:relative;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut__track{stroke:var(--surface-3);fill:none}
.donut__arc{
  stroke:var(--accent);fill:none;stroke-linecap:round;
  transition:stroke-dashoffset 900ms var(--ease-out);
}
.donut__val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-h3);font-weight:700;
}

.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar__fill{
  height:100%;border-radius:99px;background:var(--accent);
  box-shadow:inset 0 0 0 1px var(--border-2);
  transition:width 800ms var(--ease-out);
}

.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--surface-3);display:block}
.dots i.is-on{background:var(--accent)}

/* stepper (onboarding) */
.stepper{display:flex;gap:6px;align-items:center}
.stepper i{
  height:4px;border-radius:99px;background:var(--surface-3);
  flex:1;transition:background-color var(--t-base);
}
.stepper i.is-on{background:var(--accent)}

/* ---------------- EMPTY / LOADER ---------------- */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:var(--s8) var(--s5);gap:var(--s3);
}
.empty__ico{
  width:68px;height:68px;border-radius:50%;
  background:var(--surface-tint);color:var(--accent-2);
  display:flex;align-items:center;justify-content:center;
}
.empty__t{font-size:var(--fs-h2);font-weight:700}
.empty__s{font-size:var(--fs-sm);color:var(--text-2);max-width:280px}

.spinner{
  width:18px;height:18px;border-radius:50%;flex:none;
  border:2px solid currentColor;border-top-color:transparent;
  animation:spin .7s linear infinite;opacity:.9;
}

/* AI thinking dots */
.thinking{display:inline-flex;gap:4px;align-items:center}
.thinking i{
  width:6px;height:6px;border-radius:99px;background:currentColor;
  animation:blink 1.2s infinite both;
}
.thinking i:nth-child(2){animation-delay:.18s}
.thinking i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------------- INSTALL (PWA) BANNER ---------------- */
.pwa-banner{
  position:fixed;left:var(--s4);right:var(--s4);
  bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--s4));
  z-index:var(--z-toast);
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s3) var(--s3) var(--s4);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--sh-pop);
  transform:translateY(16px);opacity:0;
  transition:transform var(--t-base) var(--ease-spring),opacity var(--t-base);
}
.pwa-banner.is-in{transform:translateY(0);opacity:1}
.pwa-banner__ico{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
}
.pwa-banner__txt{display:flex;flex-direction:column;min-width:0;flex:1}
.pwa-banner__txt strong{font-size:var(--fs-h3);font-weight:700;line-height:1.2}
.pwa-banner__txt small{font-size:var(--fs-xs);color:var(--text-2);line-height:1.35}
.pwa-banner .btn--sm{flex:none}

@media (min-width:1024px){
  .pwa-banner{
    left:auto;right:var(--s7);
    bottom:calc(var(--s7) + 72px);
    max-width:400px;
  }
}

/* ---------------- SAVE CONTROL (bottom sheet) ----------------
   The label lives in its own element so the icon and text align
   on one flex baseline, and the button reserves a fixed width so
   it does not jump when it flips between Save and Saved.        */
.sheet__save{
  min-width:104px;
  justify-content:center;
  gap:7px;
  background:var(--surface);
  border-color:var(--border);
  color:var(--text);
}
.sheet__save .ico{flex:none}
.sheet__save [data-save-label]{line-height:1;white-space:nowrap}
.sheet__save:hover{border-color:var(--border-2);background:var(--surface-2)}
.sheet__save.is-saved{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-text);
}
.sheet__save.is-saved .ico{color:var(--accent-2)}

/* saved marker on a product card */
.prodcard__saved{
  position:absolute;top:12px;right:12px;z-index:2;
  width:30px;height:30px;border-radius:99px;
  display:block;line-height:0;
  background:var(--plate-chip);
  border:1px solid var(--plate-chip-bd);
  color:var(--accent-2);
  box-shadow:0 2px 8px rgba(20,14,10,.14);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.prodcard__saved .ico{
  position:absolute;top:50%;left:50%;
  width:16px;height:16px;
  transform:translate(-50%,-50%);
  fill:currentColor;stroke:none;
}

/* the wishlist remove control reuses .fav but carries a bookmark */
.fav.is-on .ico{fill:currentColor}
.fav:hover .ico{transform:translate(-50%,-50%) scale(1.06)}


/* ===== css/layout.css ===== */
/* ==========================================================
   AURA FIT - APP SHELL & RESPONSIVE LAYOUT
   Mobile-first. Bottom tab bar + bottom-RIGHT floating "+".
   Desktop >= 1024px switches to a left sidebar.
   ========================================================== */

.app{min-height:100dvh;display:flex;flex-direction:column}
.main{min-width:0}

/* ---------------- TOP BAR ---------------- */
.topbar{
  position:sticky;top:0;z-index:var(--z-nav);
  min-height:var(--topbar-h);height:auto;
  display:grid;grid-template-columns:minmax(44px,1fr) minmax(0,2fr) minmax(44px,1fr);align-items:center;gap:var(--s2);
  padding:0 var(--s3);
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color var(--t-base), background-color var(--t-base);
}
.topbar.is-stuck{border-bottom-color:var(--divider)}
.topbar__title{
  min-width:0;text-align:center;
  font-size:var(--fs-h2);font-weight:700;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar__side{display:flex;align-items:center;gap:2px;min-width:44px}
.topbar__side--r{justify-content:flex-end}
/* reserved slot for the future three-dot menu (top-left) */
.topbar__future{display:none}

/* brand lockup used on the home top bar */
.brand{display:flex;align-items:center;gap:var(--s2)}
.brand__mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-card);
}
.brand__mark .ico{width:17px;height:17px;stroke-width:2}
.brand__name{font-size:var(--fs-h2);font-weight:800;letter-spacing:-.03em}
.brand__name em{font-style:normal;color:var(--accent-2)}

/* ---------------- VIEW / CONTENT ---------------- */
.view{
  flex:1;
  padding:0 var(--s4);
  padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 78px);
  max-width:var(--content-max);width:100%;margin:0 auto;
}
.view--flush{padding-left:0;padding-right:0}
.view__inner{padding:0 var(--s4)}

/* ---------------- BOTTOM TAB BAR (4 tabs, no centre slot) ---------------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:var(--z-nav);
  height:calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--border);
}
.tabbar__btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-2);font-size:var(--fs-xxs);font-weight:600;
  transition:color var(--t-fast);position:relative;
}
.tabbar__btn:hover{color:var(--text-2)}
.tabbar__btn.is-active{color:var(--text)}
.tabbar__btn.is-active .ico{color:var(--accent-2)}
.tabbar__btn .ico{width:22px;height:22px;transition:transform var(--t-base) var(--ease-spring)}
.tabbar__btn.is-active .ico{transform:translateY(-1px) scale(1.06)}
.tabbar__btn.is-active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);
}

/* ---------------- FLOATING "+" (BOTTOM-RIGHT, like a chat bubble) -------
   Deliberately NOT centred in the tab bar - per product requirement.
   ---------------------------------------------------------------------- */
.fab{
  position:fixed;right:var(--s4);z-index:var(--z-fab);
  bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--s4));
  height:54px;min-width:54px;padding:0;
  border-radius:var(--r-full);
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  background:var(--accent);color:var(--on-accent);
  box-shadow:var(--sh-fab);
  gap:0;
  transition:transform var(--t-base) var(--ease-spring),
             box-shadow var(--t-base), padding var(--t-base) var(--ease-out),
             opacity var(--t-base);
}
.fab .ico{width:24px;height:24px;stroke-width:2.1;flex:none}
.fab__label{
  max-width:0;opacity:0;white-space:nowrap;overflow:hidden;
  font-size:var(--fs-h3);font-weight:700;
  transition:max-width var(--t-base) var(--ease-out),opacity var(--t-fast);
}
.fab:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--sh-pop)}
.fab:active{transform:scale(.95)}
.fab.is-hidden,
body.is-sheet-open .fab{opacity:0;pointer-events:none;transform:scale(.8) translateY(8px)}

/* pulse ring on first load, draws the eye like a support bubble */
.fab::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  border:2px solid var(--accent);opacity:0;
}
.fab.is-pulse::after{animation:fabPulse 2.4s var(--ease-out) 2}
@keyframes fabPulse{
  0%{opacity:.7;transform:scale(1)}
  100%{opacity:0;transform:scale(1.55)}
}

/* ---------------- SIDEBAR (desktop) ---------------- */
.sidebar{display:none}

/* ---------------- AUTH / FULLSCREEN SHELL ---------------- */
.auth{
  min-height:100dvh;display:flex;flex-direction:column;
  padding:var(--s6) var(--s5) calc(var(--s6) + var(--safe-b));
  max-width:460px;margin:0 auto;width:100%;
}
.auth__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s7)}
.auth__body{flex:1;display:flex;flex-direction:column;justify-content:center}
.auth__logo{
  width:60px;height:60px;border-radius:18px;margin-bottom:var(--s5);
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-fab);
}
.auth__logo .ico{width:32px;height:32px;stroke-width:1.8}
.auth__title{font-size:var(--fs-display);font-weight:800;letter-spacing:-.03em}
.auth__sub{font-size:var(--fs-h3);color:var(--text-2);margin-top:6px;margin-bottom:var(--s6)}
.auth__foot{text-align:center;font-size:var(--fs-sm);color:var(--text-2);margin-top:var(--s5)}
.auth__foot button{font-weight:700;color:var(--accent-2)}
.auth__foot button:hover{text-decoration:underline}
.auth__divider{
  display:flex;align-items:center;gap:var(--s3);
  margin:var(--s5) 0;color:var(--text-3);font-size:var(--fs-xs);
}
.auth__divider::before,.auth__divider::after{
  content:"";flex:1;height:1px;background:var(--divider);
}

/* ==========================================================
   TABLET  >= 720px
   ========================================================== */
@media (min-width:720px){
  .view{padding-left:var(--s6);padding-right:var(--s6)}
  .view__inner{padding:0 var(--s6)}
  .topbar{padding:0 var(--s5);min-height:68px}
  .fab{right:var(--s6);bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--s5))}
  .fab:hover{padding:0 var(--s5) 0 var(--s4)}
  .fab:hover .fab__label{max-width:130px;opacity:1;margin-left:var(--s2)}
}

/* ==========================================================
   DESKTOP  >= 1024px  - sidebar navigation
   ========================================================== */
@media (min-width:1024px){
  :root{--topbar-h:74px}

  .app{flex-direction:row}

  .tabbar{display:none}

  .sidebar{
    display:flex;flex-direction:column;
    width:var(--sidebar-w);flex:none;
    height:100dvh;position:sticky;top:0;
    padding:var(--s6) var(--s4);
    background:var(--surface);
    border-right:1px solid var(--border);
    overflow-y:auto;
  }
  .sidebar__brand{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s3);margin-bottom:var(--s7)}
  .sidebar__brand .brand__mark{width:36px;height:36px;border-radius:11px}
  .sidebar__brand .brand__mark .ico{width:20px;height:20px}
  .sidebar__brand .brand__name{font-size:19px}

  .sidebar__nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .sidebar__lbl{
    font-size:var(--fs-xxs);font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--text-3);
    padding:0 var(--s3);margin:var(--s5) 0 var(--s2);
  }
  .sidebar__btn{
    display:flex;align-items:center;gap:var(--s3);
    height:46px;padding:0 var(--s3);border-radius:var(--r-sm);
    font-size:var(--fs-h3);font-weight:600;color:var(--text-2);
    transition:background-color var(--t-fast),color var(--t-fast);
    text-align:left;position:relative;
  }
  .sidebar__btn:hover{background:var(--surface-2);color:var(--text)}
  .sidebar__btn.is-active{background:var(--surface-tint);color:var(--text)}
  .sidebar__btn.is-active .ico{color:var(--accent-2)}
  .sidebar__btn .ico{width:21px;height:21px}
  .sidebar__btn .badge{margin-left:auto}

  .sidebar__foot{border-top:1px solid var(--divider);padding-top:var(--s4);margin-top:var(--s4)}
  .sidebar__user{
    display:flex;align-items:center;gap:var(--s3);
    padding:var(--s2) var(--s3);border-radius:var(--r-sm);width:100%;text-align:left;
    transition:background-color var(--t-fast);
  }
  .sidebar__user:hover{background:var(--surface-2)}
  .sidebar__avatar{
    width:36px;height:36px;border-radius:99px;flex:none;
    background:var(--surface-tint);color:var(--accent-2);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:var(--fs-sm);
  }

  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  .topbar{
    padding:0 var(--s7);
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 82%, transparent);
  }
  .topbar{grid-template-columns:auto 1fr auto}
  .topbar__title{text-align:left;font-size:var(--fs-title)}
  .topbar__side{min-width:0}
  .topbar .topbar__side--l:empty{display:none}

  .view{
    padding:0 var(--s7);
    padding-bottom:112px;
  }
  .view__inner{padding:0 var(--s7)}

  .fab{
    right:var(--s7);bottom:var(--s7);
    height:56px;padding:0 var(--s5) 0 var(--s4);
  }
  .fab .fab__label{max-width:140px;opacity:1;margin-left:var(--s2)}

  /* sheet becomes a centred docked panel on large screens */
  .sheet{
    left:50%;right:auto;transform:translate(-50%,100%);
    width:min(760px, calc(100vw - 96px));
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    height:70vh;
  }
  .sheet.is-open{transform:translate(-50%,0)}

  .toast-layer{bottom:var(--s7);align-items:flex-start;padding-left:calc(var(--sidebar-w) + var(--s7))}
}

/* ==========================================================
   WIDE  >= 1400px
   ========================================================== */
@media (min-width:1400px){
  :root{--sidebar-w:272px}
  .view{padding-left:var(--s8);padding-right:var(--s8)}
}

/* Desktop-only / mobile-only helpers */
.only-desktop{display:none}
@media (min-width:1024px){
  .only-desktop{display:initial}
  .only-mobile{display:none !important}
}


/* ===== css/screens.css ===== */
/* ==========================================================
   AURA FIT - SCREEN COMPOSITION
   ========================================================== */

/* ================= HOME ================= */
.greet{padding:var(--s2) 0 var(--s5)}
.greet__hi{
  font-size:var(--fs-display);font-weight:800;letter-spacing:-.03em;
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
}
.greet__hi .ico{width:22px;height:22px;color:var(--accent)}
.greet__sub{font-size:var(--fs-h3);color:var(--text-2);margin-top:4px}

.home__search{display:flex;gap:var(--s3);margin-bottom:var(--s4)}
.home__search .searchbar{flex:1;min-width:0}
.home__search .iconbtn{width:48px;height:48px;border-radius:var(--r-sm)}

/* calendar strip */
.calstrip{margin:var(--s5) 0 var(--s2)}
.calstrip__days{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px 0}
.calstrip__days::-webkit-scrollbar{display:none}
.calday{
  flex:none;width:52px;padding:var(--s3) 0;
  border-radius:var(--r-sm);text-align:center;
  background:var(--surface);border:1px solid var(--border);
  transition:all var(--t-base) var(--ease-out);
}
.calday:hover{border-color:var(--border-2);transform:translateY(-2px)}
.calday__d{font-size:var(--fs-xxs);font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.calday__n{font-size:var(--fs-h2);font-weight:700;margin-top:3px}
.calday.is-active{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.calday.is-active .calday__d{color:var(--on-primary);opacity:.7}
.calday.is-today:not(.is-active) .calday__n{color:var(--accent-2)}

/* outfit of the day */
.ootd{
  display:grid;grid-template-columns:132px 1fr;gap:var(--s4);
  padding:var(--s4);align-items:center;
}
.ootd__thumb{display:block;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:var(--plate);
  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base)}
.ootd__thumb:hover{transform:translateY(-2px);box-shadow:var(--sh-raised)}
.ootd__body{min-width:0;display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start}
.ootd__name{font-size:var(--fs-title);font-weight:800;letter-spacing:-.025em;line-height:1.15}
.ootd__why{font-size:var(--fs-xs);color:var(--text-2);line-height:1.45}
.ootd__meta{display:flex;gap:var(--s2);flex-wrap:wrap}
.ootd__acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s1);width:100%}
.ootd__acts .btn--sm{padding:0 var(--s3);min-width:0}
.ootd__acts .btn--sm.grow{flex-basis:90px}
@media (max-width:400px){.ootd{grid-template-columns:104px 1fr;gap:var(--s3)}}

/* stat tiles */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.stat{
  padding:var(--s4) var(--s3);border-radius:var(--r-sm);
  background:var(--surface-tint);position:relative;overflow:hidden;
}
.stat__n{font-size:var(--fs-title);font-weight:800;letter-spacing:-.03em;line-height:1}
.stat__l{font-size:var(--fs-xs);color:var(--text-2);margin-top:5px;font-weight:600;padding-right:26px}
.stat__ico{position:absolute;right:10px;bottom:8px;color:var(--accent-2);opacity:.45}
.stat__ico .ico{width:22px;height:22px}
html[data-theme="dark"] .stat__n{color:var(--text)}

/* outfit ideas carousel */
.ideas-rail{gap:var(--s3);padding:2px var(--s4) var(--s2);margin:0 calc(var(--s4) * -1)}
.ideacard{flex:none;width:132px;scroll-snap-align:start;text-align:left}
.ideacard__thumb{
  aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;
  background:var(--plate);position:relative;
  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base);
}
.ideacard:hover .ideacard__thumb{transform:translateY(-3px);box-shadow:var(--sh-raised)}
.ideacard__name{font-size:var(--fs-sm);font-weight:600;margin-top:var(--s2)}
.ideacard__meta{font-size:var(--fs-xxs);color:var(--text-3);margin-top:1px}

/* style stats card */
.styleStat{display:flex;align-items:center;gap:var(--s4);padding:var(--s4);background:var(--surface-tint);border-radius:var(--r-sm)}
.styleStat__t{font-size:var(--fs-h3);font-weight:700}
.styleStat__s{font-size:var(--fs-xs);color:var(--text-2);margin-top:3px;line-height:1.45}

/* ================= WARDROBE ================= */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.catcard{
  border-radius:var(--r-md);overflow:hidden;background:var(--surface);
  border:1px solid var(--border);text-align:center;
  transition:border-color var(--t-fast),box-shadow var(--t-base),transform var(--t-base);
}
.catcard:hover{border-color:var(--border-2);box-shadow:var(--sh-raised);transform:translateY(-2px)}
.catcard__thumb{aspect-ratio:1/1;background:var(--plate)}
.catcard__body{padding:var(--s3) var(--s2)}
.catcard__name{font-size:var(--fs-sm);font-weight:700}
.catcard__count{font-size:var(--fs-xxs);color:var(--text-3);margin-top:2px}

.itemgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}
@media (min-width:520px){.itemgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1024px){
  .itemgrid{grid-template-columns:repeat(4,1fr);gap:var(--s4)}
  .catgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s4)}
}
@media (min-width:1400px){.itemgrid{grid-template-columns:repeat(5,1fr)}}

.itemcard{position:relative;text-align:left}
.itemcard__thumb{
  aspect-ratio:1/1;border-radius:var(--r-md);overflow:hidden;
  background:var(--plate);border:1px solid var(--border);
  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base),border-color var(--t-fast);
}
.itemcard:hover .itemcard__thumb{transform:translateY(-3px);box-shadow:var(--sh-raised);border-color:var(--border-2)}
.itemcard__name{font-size:var(--fs-sm);font-weight:600;margin-top:var(--s2)}
.itemcard__meta{font-size:var(--fs-xxs);color:var(--text-3);margin-top:1px}
.itemcard__dot{
  width:9px;height:9px;border-radius:99px;display:inline-block;
  border:1px solid var(--border-2);vertical-align:middle;margin-right:5px;
}

/* ================= ITEM DETAIL / OUTFIT SELECTION ================= */
.detail__hero{
  aspect-ratio:1/1;border-radius:var(--r-lg);overflow:hidden;
  background:var(--plate);border:1px solid var(--border);
  max-width:420px;margin:0 auto;
}
.detail__title{font-size:var(--fs-title);font-weight:800;letter-spacing:-.03em;margin-top:var(--s5)}
.detail__meta{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s2)}

.deflist{margin-top:var(--s5);border-top:1px solid var(--divider)}
.defrow{padding:var(--s4) 0;border-bottom:1px solid var(--divider)}
.defrow__k{font-size:var(--fs-h3);font-weight:700}
.defrow__v{font-size:var(--fs-sm);color:var(--text-2);margin-top:3px}

.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s5)}
.actbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:var(--s4) var(--s2);border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);
  font-size:var(--fs-xs);font-weight:600;
  transition:all var(--t-fast);
}
.actbtn:hover{background:var(--surface-2);border-color:var(--border-2);transform:translateY(-2px)}
.actbtn--danger{color:var(--danger)}

/* category selector: Top / Bottom / Shoes */
.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s5)}
.catpick__btn{
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  padding:var(--s4) var(--s2);border-radius:var(--r-md);
  background:var(--surface);border:1.5px solid var(--border);
  font-size:var(--fs-sm);font-weight:600;color:var(--text-2);
  transition:all var(--t-base) var(--ease-out);
}
.catpick__btn:hover{border-color:var(--border-2);color:var(--text)}
.catpick__btn .ico{width:26px;height:26px;stroke-width:1.5}
.catpick__btn.is-active{
  border-color:var(--accent);background:var(--accent-soft);color:var(--text);
  box-shadow:0 0 0 3px var(--accent-ring);
}
.catpick__btn.is-active .ico{color:var(--accent-2)}

/* the two primary actions */
.finder{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s5)}
@media (max-width:480px){.finder{grid-template-columns:1fr}}

/* ================= ADD ITEM ================= */
.dropzone{
  border:1.5px dashed var(--border-2);
  border-radius:var(--r-md);
  background:var(--surface);
  padding:var(--s8) var(--s5);
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  text-align:center;width:100%;position:relative;overflow:hidden;
  transition:all var(--t-base) var(--ease-out);
  min-height:200px;justify-content:center;
}
.dropzone:hover,.dropzone.is-drag{
  border-color:var(--accent);background:var(--accent-soft);
}
.dropzone__ico{color:var(--text-2)}
.dropzone__ico .ico{width:38px;height:38px;stroke-width:1.4}
.dropzone__t{font-size:var(--fs-h3);font-weight:700}
.dropzone__s{font-size:var(--fs-xs);color:var(--text-3)}
.dropzone.has-img{padding:0;border-style:solid;border-color:var(--border);min-height:0}
.dropzone__preview{width:100%;aspect-ratio:1/1;background:var(--plate)}
.dropzone__preview img{width:100%;height:100%;object-fit:cover}
.dropzone__change{
  position:absolute;right:var(--s3);bottom:var(--s3);
  height:36px;padding:0 var(--s4);border-radius:99px;
  background:var(--primary);color:var(--on-primary);
  font-size:var(--fs-xs);font-weight:700;
  display:flex;align-items:center;gap:6px;box-shadow:var(--sh-raised);
}
.photo-opts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}

/* ================= AI IDEAS ================= */
.ideagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
@media (max-width:520px){.ideagrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.ideagrid{grid-template-columns:repeat(4,1fr);gap:var(--s4)}}
@media (min-width:1400px){.ideagrid{grid-template-columns:repeat(5,1fr)}}

.outfitcard{position:relative;text-align:left}
.outfitcard__thumb{
  aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;
  background:var(--plate);border:1px solid var(--border);
  /* Give the independent favourite action its own space. At phone
     widths an overlaid 44px target otherwise covers the garment. */
  padding:60px var(--s2) var(--s2);
  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base);
}
.outfitcard__thumb > svg{width:100%;height:100%}
.outfitcard:hover .outfitcard__thumb{transform:translateY(-3px);box-shadow:var(--sh-raised)}
.outfitcard__name{font-size:var(--fs-sm);font-weight:600;margin-top:var(--s2)}
.outfitcard__meta{font-size:var(--fs-xxs);color:var(--text-3);margin-top:1px;display:flex;align-items:center;gap:5px}

/* AI stylist panel */
.stylist{
  background:var(--surface-tint);border-radius:var(--r-md);
  padding:var(--s5);margin-top:var(--s6);position:relative;overflow:hidden;
}
.stylist::before{
  content:"";position:absolute;right:-40px;top:-40px;
  width:150px;height:150px;border-radius:50%;
  background:var(--accent);opacity:.16;
}
.stylist__head{display:flex;align-items:center;gap:var(--s2);position:relative}
.stylist__head .ico{width:20px;height:20px;color:var(--accent-2);fill:currentColor;stroke:none}
.stylist__t{font-size:var(--fs-h2);font-weight:700}
.stylist__s{font-size:var(--fs-sm);color:var(--text-2);margin:var(--s2) 0 var(--s4);max-width:340px;position:relative}
.stylist__prompts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4);position:relative}
.stylist__prompt{
  min-height:36px;padding:7px var(--s3);border-radius:99px;
  background:var(--surface);border:1px solid var(--border);
  font-size:var(--fs-xs);font-weight:600;color:var(--text-2);
  transition:all var(--t-fast);
}
.stylist__prompt:hover{color:var(--text);border-color:var(--accent);background:var(--surface)}
.stylist .btn{position:relative}

.stylist__answer{
  margin-top:var(--s4);padding:var(--s4);
  background:var(--surface);border-radius:var(--r-sm);
  border:1px solid var(--border);position:relative;
  font-size:var(--fs-sm);line-height:1.6;
  animation:fadeUp var(--t-base) var(--ease-out) both;
}
.stylist__answer strong{font-weight:700}

/* ================= STATS ================= */
.usage{display:flex;align-items:center;gap:var(--s5);padding:var(--s5);background:var(--surface-tint);border-radius:var(--r-md)}
.usage__t{font-size:var(--fs-h2);font-weight:700}
.usage__s{font-size:var(--fs-sm);color:var(--text-2);margin-top:4px;line-height:1.45}

.barlist{display:flex;flex-direction:column;gap:var(--s4)}
.barrow{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:var(--s3)}
.barrow__k{font-size:var(--fs-sm);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow__v{font-size:var(--fs-sm);color:var(--text-2);text-align:right;font-weight:600}

.profileStyle{display:flex;align-items:center;gap:var(--s4);padding:var(--s5)}
.profileStyle__ring{
  width:78px;height:78px;border-radius:50%;flex:none;
  background:var(--surface-tint);color:var(--accent-2);
  display:flex;align-items:center;justify-content:center;
}
.profileStyle__ring .ico{width:38px;height:38px;stroke-width:1.3}
.profileStyle__t{font-size:var(--fs-h2);font-weight:700}
.profileStyle__s{font-size:var(--fs-sm);color:var(--text-2);margin-top:var(--s2)}

/* ================= ACCOUNT ================= */
.profhead{display:flex;align-items:center;gap:var(--s4);padding:var(--s5) 0 var(--s6)}
.profhead__av{
  width:68px;height:68px;border-radius:50%;flex:none;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-title);font-weight:800;
  box-shadow:var(--sh-card);
}
.profhead__n{font-size:var(--fs-title);font-weight:800;letter-spacing:-.025em}
.profhead__e{font-size:var(--fs-sm);color:var(--text-2);margin-top:2px}

.prefchips{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}

/* ================= ONBOARDING ================= */
.onb{min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;width:100%;
     padding:var(--s5) var(--s5) calc(var(--s5) + var(--safe-b))}
.onb__top{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s6)}
.onb__body{flex:1;overflow-y:auto}
.onb__q{font-size:var(--fs-display);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.onb__hint{font-size:var(--fs-h3);color:var(--text-2);margin:var(--s2) 0 var(--s6)}
.onb__foot{padding-top:var(--s5);display:flex;gap:var(--s3)}

.optgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}
.optgrid--3{grid-template-columns:repeat(3,1fr)}
.opt{
  padding:var(--s4);border-radius:var(--r-md);
  background:var(--surface);border:1.5px solid var(--border);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);
  text-align:left;transition:all var(--t-base) var(--ease-out);
}
.opt:hover{border-color:var(--border-2);transform:translateY(-2px)}
.opt.is-active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-ring)}
.opt__ico{width:34px;height:34px;border-radius:10px;background:var(--surface-tint);color:var(--accent-2);
          display:flex;align-items:center;justify-content:center}
.opt.is-active .opt__ico{background:var(--accent);color:var(--on-accent)}
.opt__t{font-size:var(--fs-h3);font-weight:700}
.opt__s{font-size:var(--fs-xs);color:var(--text-2);line-height:1.4}

/* ================= SPLASH ================= */
.splash{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);
  background:var(--bg);background-image:var(--bg-grad);
  transition:opacity var(--t-slow) var(--ease-out);
}
.splash.is-out{opacity:0;pointer-events:none}
.splash__mark{
  width:76px;height:76px;border-radius:22px;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-fab);
  animation:pop 600ms var(--ease-spring) both;
}
.splash__mark .ico{width:40px;height:40px;stroke-width:1.7}
.splash__name{font-size:28px;font-weight:800;letter-spacing:-.04em;animation:fadeUp 600ms var(--ease-out) 120ms both}
.splash__name em{font-style:normal;color:var(--accent-2)}
.splash__tag{font-size:var(--fs-sm);color:var(--text-2);animation:fadeUp 600ms var(--ease-out) 220ms both;text-align:center;padding:0 var(--s5)}

/* ================= DESKTOP TWO-COLUMN ================= */
@media (min-width:1024px){
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:var(--s6);align-items:start}
  .cols--wide{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
  .ootd{grid-template-columns:180px 1fr}
  .detail__grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:var(--s7);align-items:start}
  .detail__hero{margin:0;max-width:none}
  .detail__title{margin-top:0}
  .ideas-rail{margin:0;padding-left:0;padding-right:0}
  .ideacard{width:160px}
  .stats3{gap:var(--s4)}
}


/* ==========================================================
   CARD INTERNALS
   These sub-elements are <span>s inside <button>s. Inline boxes
   ignore aspect-ratio, overflow, margin-block, transform and
   text-overflow, so every card must blockify its own children.
   ========================================================== */
.itemcard,
.ideacard,
.catcard,
.outfitcard__link,
.prodcard{
  display:flex;flex-direction:column;align-items:stretch;
}

.itemcard__thumb,.itemcard__name,.itemcard__meta,
.ideacard__thumb,.ideacard__name,.ideacard__meta,
.catcard__thumb,.catcard__body,.catcard__name,.catcard__count,
.outfitcard__thumb,.outfitcard__name{
  display:block;
}
.outfitcard__meta{display:flex}

/* selected state for the outfit builder */
.itemcard.is-selected .itemcard__thumb{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-ring);
}
.itemcard.is-selected .prodcard__tick{opacity:1;transform:scale(1)}

/* Content determines its height; long names and translated labels wrap. */
.cols > *,.detail__grid > *,.itemgrid > *,.ideagrid > *,.catgrid > *{min-width:0}
.profhead > :not(.profhead__av){min-width:0}
.greet__hi,.profhead__n,.profhead__e,.detail__title,.defrow__v,.itemcard__name,.outfitcard__name,.prodcard__name,.ootd__name,.ideacard__name{overflow-wrap:anywhere}
.outfitcard__link{width:100%;text-align:left}
.stylist__prompt,.dropzone__change{min-height:44px}
.stat__l{padding-right:0}
.stat__ico{top:12px;bottom:auto;opacity:.6}
.stat__n{padding-right:24px}

/* At small laptop widths the sidebar leaves too little room for two
   dashboard columns. Keep the outfit and form controls comfortable. */
@media (min-width:1024px) and (max-width:1279px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .ootd{grid-template-columns:180px minmax(0,1fr)}
  .detail__grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5)}
}
@media (max-width:479px){
  .ootd{grid-template-columns:96px minmax(0,1fr);gap:var(--s3)}
  .ootd__acts{display:grid;grid-template-columns:minmax(0,1fr) 44px}
  .ootd__acts .btn{padding:8px}
  .sheet__bar{flex-wrap:wrap}
  .sheet__bar-info{flex-basis:100%}
  .sheet__bar > .btn{flex:1}
  .optgrid--3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats3{gap:var(--s2)}
  .stat{padding:var(--s3)}
  .stat__ico{display:none}
  .stat__n{padding-right:0}
}
@media (max-height:500px){
  .sheet{height:92dvh}
}

/* A desktop wardrobe is a workspace: keep today's look beside its
   useful context, then give the outfit rail the full canvas width. */
@media (min-width:1280px){
  .view:has(> [data-ootd]){
    display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
    gap:var(--s5) var(--s6);align-content:start;align-items:start;
  }
  .view:has(> [data-ootd]) > *{min-width:0;margin-top:0;margin-bottom:0}
  .view:has(> [data-ootd]) > .greet,
  .view:has(> [data-ootd]) > .home__search,
  .view:has(> [data-ootd]) > .chips,
  .view:has(> [data-ootd]) > .calstrip{grid-column:1 / -1}
  .view:has(> [data-ootd]) > .greet{padding-bottom:0}
  .view > [data-ootd]{grid-column:1;grid-row:5 / span 2;align-self:stretch}
  .view > [data-ootd] .ootd{height:100%;grid-template-columns:minmax(120px,180px) minmax(0,1fr)}
  .view > [data-ootd] + .sec{grid-column:2;grid-row:5}
  .view > [data-ootd] + .sec + .sec{grid-column:1 / -1;grid-row:7}
  .view > [data-ootd] + .sec + .sec + .sec{grid-column:2;grid-row:6}
  .ootd__acts{max-width:280px}
  .view:has(> [data-ootd]) .stats3{gap:var(--s2)}
  .view:has(> [data-ootd]) .stat{padding:var(--s3)}
  .view:has(> [data-ootd]) .stat__ico{display:none}
  .view:has(> [data-ootd]) .stat__n{padding-right:0}
}

/* ==========================================================
   SMALL-PHONE TUNING (<=400px)
   The display size is set for 390px+; below that the greeting
   and section titles crowd the gutters.
   ========================================================== */
@media (max-width:400px){
  .greet__hi{font-size:23px}
  .greet__sub{font-size:var(--fs-body)}
  .ootd__name{font-size:19px}
  .detail__title{font-size:20px}
  .a-head__t{font-size:22px}
  .a-start__name{font-size:27px}
}


/* ===== css/auth.css ===== */
/* ==========================================================
   AURA FIT - AUTH & ONBOARDING FLOW
   Geometry taken from the reference kit:
     input  h 52  r 14
     button h 54  r 20
     social h 52  r 14
   ========================================================== */

.a-screen{
  min-height:100dvh;
  display:flex;flex-direction:column;
  width:100%;
  background:var(--bg);
  background-image:var(--bg-grad);
}

.a-wrap{
  width:100%;max-width:400px;margin:0 auto;
  padding:0 var(--s5) calc(var(--s6) + var(--safe-b));
  display:flex;flex-direction:column;flex:1;
}

/* ---------------- top bar ---------------- */
.a-top{
  display:flex;align-items:center;justify-content:space-between;
  height:56px;flex:none;margin-bottom:var(--s2);
}
.a-top__spacer{width:40px;height:40px;flex:none}
.a-skip{
  height:36px;padding:0 var(--s3);border-radius:var(--r-full);
  font-size:var(--fs-sm);font-weight:600;color:var(--text-2);
  display:inline-flex;align-items:center;
  transition:color var(--t-fast),background-color var(--t-fast);
}
.a-skip:hover{color:var(--text);background:var(--surface-2)}

/* ---------------- brand lockup ---------------- */
.a-brand{
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  margin-bottom:var(--s6);flex:none;
}
.a-brand__mark{
  width:52px;height:52px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
}
.a-brand__mark .ico{width:46px;height:46px;stroke-width:1.5}
.a-brand__name{
  font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.1;
  color:var(--text);
}
.a-brand__name em{font-style:normal;color:var(--accent);font-weight:700}

/* ---------------- headings ---------------- */
.a-head{text-align:center;margin-bottom:var(--s6);flex:none}
.a-head__t{
  font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.2;
  color:var(--text);
}
.a-head__s{
  font-size:var(--fs-h3);color:var(--text-2);
  margin-top:var(--s2);line-height:1.5;
  max-width:320px;margin-left:auto;margin-right:auto;
}

/* Profile selection uses the same surfaces and peach accents as auth. */
.a-gender{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s6)}
.a-gender__option{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);min-height:172px;padding:var(--s6) var(--s3);border:2px solid var(--border-2);border-radius:var(--r-lg);background:var(--surface);color:var(--text);font-size:var(--fs-h2);font-weight:700}
.a-gender__option:hover{border-color:var(--accent-text)}
.a-gender__option[aria-pressed="true"]{border-color:var(--accent-text);background:var(--accent-soft)}
.a-gender__option:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.a-gender__symbol{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:var(--r-full);background:var(--surface-2);color:var(--accent-text);font-size:44px;font-weight:500;line-height:1}
.a-gender__check{position:absolute;top:12px;right:12px;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--r-full);background:var(--primary);color:var(--on-primary);visibility:hidden}
.a-gender__check .ico{width:14px;height:14px}
.a-gender__option[aria-pressed="true"] .a-gender__check{visibility:visible}

/* ---------------- fields ---------------- */
.a-form{display:flex;flex-direction:column;gap:var(--s3);flex:none}

.a-field{position:relative;display:block}
.a-field__box{
  position:relative;display:flex;align-items:center;
  height:52px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  transition:border-color var(--t-fast),box-shadow var(--t-fast),background-color var(--t-fast);
}
.a-field__box:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-ring);
}
.a-field__ico{
  width:52px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);pointer-events:none;
  transition:color var(--t-fast);
}
.a-field__ico .ico{width:19px;height:19px}
.a-field__box:focus-within .a-field__ico{color:var(--accent)}
.a-field input{
  flex:1;min-width:0;height:100%;
  background:none;border:0;outline:none;padding:0 var(--s2) 0 0;
  font-size:16px;color:var(--text);
}
.a-field input::placeholder{color:var(--text-3)}
.a-field input:-webkit-autofill{
  -webkit-text-fill-color:var(--text);
  transition:background-color 9999s ease-in-out 0s;
}
.a-field__eye{
  width:48px;height:100%;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);border-radius:0 14px 14px 0;
  transition:color var(--t-fast);
}
.a-field__eye:hover{color:var(--text)}
.a-field__eye .ico{width:19px;height:19px}

.a-field__err{
  display:none;font-size:var(--fs-xs);color:var(--danger);
  margin-top:6px;padding-left:var(--s2);font-weight:500;
}
.a-field.has-err .a-field__box{border-color:var(--danger)}
.a-field.has-err .a-field__err{display:block;animation:fadeIn var(--t-fast)}

/* ---------------- row helpers ---------------- */
.a-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex:none}
.a-link{
  font-size:var(--fs-sm);font-weight:700;color:var(--accent-text);
  transition:opacity var(--t-fast);
}
.a-link:hover{opacity:.78;text-decoration:underline}

/* checkbox */
.a-check{
  display:inline-flex;align-items:center;gap:10px;
  font-size:var(--fs-sm);color:var(--text-2);cursor:pointer;
  line-height:1.45;text-align:left;
}
.a-check input{position:absolute;opacity:0;width:0;height:0}
.a-check__box{
  width:21px;height:21px;flex:none;margin-top:1px;
  border-radius:6px;border:1.8px solid var(--border-2);
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  color:var(--on-accent);
  transition:all var(--t-fast) var(--ease-out);
}
.a-check__box .ico{
  width:13px;height:13px;stroke-width:3;
  opacity:0;transform:scale(.4);
  transition:opacity var(--t-fast),transform var(--t-fast) var(--ease-spring);
}
.a-check input:checked + .a-check__box{
  background:var(--accent);border-color:var(--accent);
}
.a-check input:checked + .a-check__box .ico{opacity:1;transform:scale(1)}
.a-check input:focus-visible + .a-check__box{box-shadow:0 0 0 3px var(--accent-ring)}
.a-check a{color:var(--accent-text);font-weight:600;text-decoration:underline}

/* ---------------- buttons ---------------- */
.a-btn{
  height:54px;width:100%;
  border-radius:20px;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  font-size:var(--fs-h2);font-weight:700;letter-spacing:-.01em;
  background:var(--accent);color:var(--on-accent);
  border:1px solid transparent;
  transition:transform var(--t-fast) var(--ease-out),filter var(--t-fast),
             box-shadow var(--t-base),opacity var(--t-fast);
  box-shadow:0 6px 18px var(--accent-ring);
}
.a-btn:hover{filter:brightness(1.05);box-shadow:0 8px 22px var(--accent-ring)}
.a-btn:active{transform:scale(.985)}
.a-btn[disabled],.a-btn.is-busy{opacity:.6;pointer-events:none}
.a-btn .ico{width:19px;height:19px;stroke-width:2.2}

/* social */
.a-social{
  position:relative;
  height:52px;width:100%;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-h3);font-weight:600;color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  transition:border-color var(--t-fast),background-color var(--t-fast),transform var(--t-fast);
}
.a-social:hover{border-color:var(--border-2);background:var(--surface-2)}
.a-social:active{transform:scale(.99)}
.a-social__ico{
  position:absolute;left:22px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
}
.ill-google{width:22px;height:22px;display:block}

/* divider */
.a-div{
  display:flex;align-items:center;gap:var(--s4);
  margin:var(--s5) 0;flex:none;
  font-size:var(--fs-sm);color:var(--text-2);
}
.a-div::before,.a-div::after{content:"";flex:1;height:1px;background:var(--border)}

/* footer line */
.a-foot{
  text-align:center;font-size:var(--fs-sm);color:var(--text-2);
  margin-top:var(--s5);flex:none;
}
.a-foot button{font-weight:700;color:var(--accent-text);margin-left:2px;min-height:44px}
.a-foot button:hover{text-decoration:underline}

/* ---------------- START SCREEN ---------------- */
.a-start{
  min-height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);
}
.a-start__media{
  position:relative;flex:none;
  height:46vh;min-height:280px;max-height:420px;
  overflow:hidden;
  background:var(--hero-bg);
}
.ill-hero{width:100%;height:100%;display:block}
.a-start__fade{
  position:absolute;left:0;right:0;bottom:-1px;height:110px;
  background:linear-gradient(to bottom, transparent, var(--bg) 88%);
  pointer-events:none;
}
.a-start__body{
  flex:1;display:flex;flex-direction:column;align-items:center;
  text-align:center;
  width:100%;max-width:400px;margin:0 auto;
  padding:0 var(--s5) calc(var(--s6) + var(--safe-b));
  margin-top:-52px;position:relative;z-index:1;
}
.a-start__mark{
  width:78px;height:78px;flex:none;
  border-radius:24px;
  border:1.8px solid var(--accent);
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  margin-bottom:var(--s4);
}
.a-start__mark .ico{width:44px;height:44px;stroke-width:1.5}
.a-start__name{
  font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1;
  color:var(--text);
}
.a-start__name em{font-style:normal;color:var(--accent)}
.a-start__tag{
  font-size:var(--fs-h2);font-weight:600;color:var(--text);
  margin-top:var(--s3);letter-spacing:-.01em;
}
.a-start__sub{
  font-size:var(--fs-h3);color:var(--text-2);line-height:1.55;
  margin-top:var(--s2);max-width:290px;
}
.a-start__dots{display:flex;gap:7px;margin:var(--s5) 0 var(--s5)}
.a-start__dots i{
  width:7px;height:7px;border-radius:99px;background:var(--border-2);
  display:block;transition:all var(--t-base) var(--ease-out);
}
.a-start__dots i.is-on{background:var(--accent);width:22px}
.a-start__cta{width:100%;margin-top:auto}

/* ---------------- CHECK EMAIL ---------------- */
.a-mailbox{
  display:flex;align-items:center;gap:var(--s3);
  width:100%;height:56px;padding:0 var(--s3) 0 var(--s4);
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;
}
.a-mailbox .ico{width:19px;height:19px;color:var(--text-3);flex:none}
.a-mailbox__val{
  flex:1;min-width:0;font-size:var(--fs-h3);color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
}
.a-mailbox__edit{
  flex:none;height:34px;padding:0 var(--s3);border-radius:var(--r-full);
  font-size:var(--fs-sm);font-weight:700;color:var(--accent);
  transition:background-color var(--t-fast);
}
.a-mailbox__edit:hover{background:var(--accent-soft)}

.a-resend{text-align:center;margin:var(--s5) 0;font-size:var(--fs-sm);color:var(--text-2)}
.a-resend__btn{
  display:inline-flex;align-items:center;gap:7px;
  margin-top:var(--s2);
  font-size:var(--fs-sm);font-weight:700;color:var(--accent);
  text-decoration:underline;
}
.a-resend__btn[disabled]{color:var(--text-3);text-decoration:none;pointer-events:none}
.a-resend__btn .ico{width:15px;height:15px}

/* ---------------- PASSWORD RULES ---------------- */
.a-rules{display:flex;flex-direction:column;gap:10px;margin-top:var(--s4)}
.a-rule{
  display:flex;align-items:center;gap:10px;
  font-size:var(--fs-sm);color:var(--text-3);
  transition:color var(--t-base);
}
.a-rule__dot{
  width:18px;height:18px;flex:none;border-radius:99px;
  border:1.6px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  color:transparent;
  transition:all var(--t-base) var(--ease-out);
}
.a-rule__dot .ico{width:11px;height:11px;stroke-width:3.2}
.a-rule.is-ok{color:var(--text)}
.a-rule.is-ok .a-rule__dot{
  background:var(--success);border-color:var(--success);color:var(--on-solid);
}

/* strength meter */
.a-strength{display:flex;gap:5px;margin-top:var(--s4)}
.a-strength i{
  flex:1;height:4px;border-radius:99px;background:var(--surface-3);
  transition:background-color var(--t-base);
}
.a-strength i.is-on{background:var(--accent)}
.a-strength.is-weak i.is-on{background:var(--danger)}
.a-strength.is-strong i.is-on{background:var(--success)}

/* ---------------- FEATURE LIST (welcome) ---------------- */
.a-feats{
  width:100%;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:var(--s5);
  display:flex;flex-direction:column;gap:var(--s4);
  text-align:left;
}
.a-feat{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-h3);color:var(--text)}
.a-feat__tick{
  width:24px;height:24px;flex:none;border-radius:99px;
  background:var(--success);color:var(--on-solid);
  display:flex;align-items:center;justify-content:center;
}
.a-feat__tick .ico{width:13px;height:13px;stroke-width:3.2}

/* ---------------- illustration sizing ---------------- */
.ill-badge{width:190px;height:auto;display:block;margin:0 auto}
.ill-badge--sm{width:132px}
.a-ill{display:flex;justify-content:center;margin:var(--s4) 0 var(--s6);flex:none}
.a-ill--tight{margin:var(--s2) 0 var(--s5)}

.ill-tick{
  stroke-dasharray:80;stroke-dashoffset:80;
  animation:illTick 620ms var(--ease-out) 180ms forwards;
}
@keyframes illTick{to{stroke-dashoffset:0}}

.ill-spark{animation:illSpark 2.6s var(--ease-out) infinite}
@keyframes illSpark{
  0%,100%{opacity:.25;transform:scale(.85)}
  50%{opacity:1;transform:scale(1)}
}

/* spacer that pushes the CTA down when content is short */
.a-grow{flex:1;min-height:var(--s5)}

/* Allow text scaling and expose unavailable providers clearly. */
.a-btn{height:auto;min-height:54px;padding:12px 20px;line-height:1.4}
.a-social{height:auto;min-height:52px;padding:12px 44px;line-height:1.4}
.a-social:disabled{opacity:.5;cursor:not-allowed;transform:none}
.a-check,.a-link,.a-skip,.a-mailbox__edit,.a-resend__btn{min-height:44px}
.a-link{display:inline-flex;align-items:center}
.a-brand__name em,.a-start__name em{color:var(--accent-text)}
.a-mailbox__edit,.a-resend__btn{color:var(--accent-text)}

/* ==========================================================
   DESKTOP - two-column split, form on the right
   ========================================================== */
@media (min-width:1024px){
  .a-screen{
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:100dvh;
  }
  .a-aside{
    display:flex;flex-direction:column;justify-content:flex-end;
    position:relative;overflow:hidden;
    background:var(--hero-bg);
    padding:var(--s8);
  }
  .a-aside .ill-hero{position:absolute;inset:0;width:100%;height:100%}
  .a-aside__copy{position:relative;z-index:1;max-width:420px}
  .a-aside__t{
    font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15;
    color:var(--hero-text);
  }
  .a-aside__t em{font-style:normal;color:var(--accent)}
  .a-aside__s{font-size:var(--fs-h2);color:var(--hero-text-2);margin-top:var(--s3);line-height:1.5}
  .a-aside__scrim{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(10,8,7,.92) 0%, rgba(10,8,7,.35) 45%, rgba(10,8,7,.15) 100%);
  }

  .a-wrap{
    max-width:420px;
    justify-content:center;
    padding:var(--s8) var(--s6);
  }
  .a-grow{display:none}

  /* start screen keeps its own full-bleed treatment */
  .a-start{display:grid;grid-template-columns:1fr 1fr}
  .a-start__media{height:100dvh;max-height:none;min-height:0}
  .a-start__body{
    margin-top:0;justify-content:center;
    padding:var(--s8) var(--s7);
    max-width:460px;
  }
  .a-start__fade{display:none}
  .a-start__cta{margin-top:var(--s5)}
}

@media (min-width:1400px){
  .a-wrap{max-width:440px}
}


/* ===== css/admin.css ===== */
/* ==========================================================
   AURA FIT - ADMIN PANEL
   Dashboard · Users · SMTP · Email templates · Settings.
   Every class is prefixed .adm- ; colours come from tokens.css
   only, so light and dark both work without overrides.
   ========================================================== */

/* ---------------- section nav ---------------- */
.adm-nav{margin-top:var(--s3)}
.adm-topbadge{height:26px}

/* ---------------- page intro ---------------- */
.adm-intro{padding:var(--s5) 0 0}
.adm-intro__t{font-size:var(--fs-display);font-weight:800;letter-spacing:-.03em;line-height:var(--lh-tight)}
.adm-intro__s{font-size:var(--fs-sm);color:var(--text-2);margin-top:4px}

/* ---------------- stat tiles ---------------- */
.adm-stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s5)}

/* ---------------- two-column blocks ---------------- */
.adm-two,.adm-cols,.adm-split{display:block}
.adm-cols__main,.adm-cols__side,.adm-split__list,.adm-split__main{min-width:0}

/* ---------------- key / value rows ---------------- */
