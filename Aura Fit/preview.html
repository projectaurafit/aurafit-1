.adm-kv__row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  min-height:48px;padding:var(--s2) 0;
  border-bottom:1px solid var(--divider);
}
.adm-kv__row:last-child{border-bottom:0}
.adm-kv__k{
  display:inline-flex;align-items:center;gap:var(--s2);
  font-size:var(--fs-sm);font-weight:600;color:var(--text-2);flex:none;
}
.adm-kv__k .ico{color:var(--text-3)}
.adm-kv__v{display:inline-flex;align-items:center;gap:var(--s1);min-width:0;text-align:right;justify-content:flex-end}
.adm-kv--tight .adm-kv__row{min-height:40px;padding:var(--s1) 0}
.adm-kv__row:has(+ .adm-kv__bar){border-bottom:0;padding-bottom:var(--s1)}
.adm-kv__bar{margin-bottom:var(--s3)}
.adm-kv__bar + .adm-kv__row{border-top:1px solid var(--divider)}

/* ---------------- activity feed ---------------- */
.adm-feed__row{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s3) var(--s4)}
.adm-feed__row + .adm-feed__row{border-top:1px solid var(--divider)}
.adm-feed__ico{
  width:34px;height:34px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-tint);color:var(--accent-2);
}
.adm-feed__ico .ico{width:17px;height:17px}
.adm-feed__t{display:block;font-size:var(--fs-sm);font-weight:600;line-height:var(--lh-snug)}
.adm-feed__s{display:block;font-size:var(--fs-xs);color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-feed__time{font-size:var(--fs-xxs);font-weight:600;color:var(--text-3);flex:none;white-space:nowrap;padding-top:3px}

/* ---------------- quick actions ---------------- */
.adm-quick{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.adm-quick .actbtn{color:var(--text)}
.adm-quick .actbtn .ico{color:var(--accent-2)}

/* ---------------- badges / pills ---------------- */
.adm-badge--danger{background:var(--danger-soft);color:var(--danger)}

.adm-pill{
  display:inline-flex;align-items:center;gap:6px;
  height:26px;padding:0 10px 0 9px;border-radius:var(--r-full);
  font-size:var(--fs-xxs);font-weight:700;letter-spacing:.01em;white-space:nowrap;
  background:var(--surface-2);color:var(--text-2);
}
.adm-pill i{width:7px;height:7px;border-radius:99px;background:currentColor;display:block;flex:none}
.adm-pill--ok{background:var(--success-soft);color:var(--success)}
.adm-pill--bad{background:var(--danger-soft);color:var(--danger)}
.adm-pill--info{background:var(--accent-soft);color:var(--accent-2)}
.adm-pill--warn{background:var(--surface-tint);color:var(--accent-2)}
.adm-pill--warn i{animation:blink 1.2s infinite both}

/* ---------------- avatar ---------------- */
.adm-av{
  width:36px;height:36px;border-radius:50%;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:var(--on-accent);font-size:var(--fs-xs);font-weight:800;letter-spacing:.02em;
}
.adm-av--lg{width:52px;height:52px;font-size:var(--fs-h3)}

/* ---------------- users: toolbar ---------------- */
.adm-toolbar{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s5)}
.adm-toolbar__search{width:100%}
.adm-toolbar .chip [data-count]{color:inherit;opacity:.6;font-weight:600}
.adm-count{margin:var(--s3) 0 var(--s2);min-height:18px}

/* ---------------- users: table ---------------- */
.adm-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.adm-table{width:100%;border-collapse:collapse;min-width:860px}
.adm-table th{
  text-align:left;font-size:var(--fs-xxs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);padding:var(--s3);white-space:nowrap;
  border-bottom:1px solid var(--border);background:var(--surface-2);
}
.adm-table th:first-child,.adm-table td:first-child{padding-left:var(--s4)}
.adm-table th:last-child,.adm-table td:last-child{padding-right:var(--s4)}
.adm-table td{
  padding:var(--s3);vertical-align:middle;white-space:nowrap;
  border-bottom:1px solid var(--divider);font-size:var(--fs-sm);
}
.adm-table tbody tr{transition:background-color var(--t-fast)}
.adm-table tbody tr:hover{background:var(--surface-2)}
.adm-table tbody tr:last-child td{border-bottom:0}
.adm-td-email__v{display:block;max-width:200px}
.adm-td-acts{text-align:right;width:1%}
.adm-td-acts .btn,.adm-td-acts .iconbtn{vertical-align:middle}
.adm-td-acts .iconbtn{width:34px;height:34px;margin-left:var(--s2)}
.adm-rowbtn{height:34px;padding:0 12px}

.adm-user{display:flex;align-items:center;gap:var(--s3);min-width:0;max-width:240px}
.adm-user__n{display:block;font-size:var(--fs-sm);font-weight:600;line-height:var(--lh-snug)}
.adm-user__e{display:block;font-size:var(--fs-xs);color:var(--text-2);margin-top:1px}

/* ---------------- floating action menu ---------------- */
.adm-menu{
  position:fixed;z-index:var(--z-modal);
  min-width:224px;padding:var(--s1);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);box-shadow:var(--sh-pop);
  opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top right;
  transition:opacity var(--t-fast),transform var(--t-fast) var(--ease-spring);
}
.adm-menu.is-open{opacity:1;transform:none}
.adm-menu__item{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  height:40px;padding:0 var(--s3);border-radius:var(--r-xs);
  font-size:var(--fs-sm);font-weight:600;color:var(--text);text-align:left;
  transition:background-color var(--t-fast);
}
.adm-menu__item:hover{background:var(--surface-2)}
.adm-menu__item .ico{width:17px;height:17px;color:var(--text-2)}
.adm-menu__item.is-danger,.adm-menu__item.is-danger .ico{color:var(--danger)}
.adm-menu__item.is-danger:hover{background:var(--danger-soft)}
.adm-menu__item.is-disabled{opacity:.45;cursor:not-allowed}
.adm-menu__item.is-disabled:hover{background:transparent}

/* ---------------- user detail modal ---------------- */
.adm-modal{max-width:460px;padding:var(--s5)}
.adm-modal__head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.adm-modal__n{font-size:var(--fs-h2);font-weight:700;letter-spacing:-.015em}
.adm-modal__e{font-size:var(--fs-xs);color:var(--text-2);margin-top:1px}
.adm-modal__acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.adm-modal__acts .btn{flex:1 1 auto}

/* ---------------- forms ---------------- */
.adm-form2{display:grid;grid-template-columns:1fr;column-gap:var(--s4)}
.adm-span2{grid-column:1 / -1}
.adm-hint{font-size:var(--fs-xs);color:var(--text-3);margin-top:6px}
.adm-actions{display:flex;justify-content:flex-end;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s2)}
.adm-actions .btn .spinner{width:16px;height:16px}

.adm-presets{
  display:flex;flex-direction:column;gap:var(--s2);
  margin-bottom:var(--s4);padding-bottom:var(--s4);border-bottom:1px solid var(--divider);
}
.adm-presets__l{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:var(--fs-xxs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);
}
.adm-presets__l .ico{color:var(--accent-2)}
.adm-presets .chips{min-width:0}

/* ---------------- notes ---------------- */
.adm-note{
  display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s4);border-radius:var(--r-md);background:var(--surface-tint);
}
.adm-note__ico{
  width:34px;height:34px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--accent-2);
}
.adm-note__t{font-size:var(--fs-sm);font-weight:700}
.adm-note__s{font-size:var(--fs-xs);color:var(--text-2);line-height:1.5;margin-top:3px}
.adm-note__s em{font-style:normal;font-weight:600;color:var(--text)}

/* ---------------- smtp test log ---------------- */
.adm-log{
  margin-top:var(--s3);padding:var(--s3);max-height:170px;overflow:auto;
  border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs-xxs);line-height:1.6;color:var(--text-2);
}
.adm-log[hidden]{display:none}
.adm-log__line{padding:1px 0;animation:fadeIn var(--t-fast) both;word-break:break-word}
.adm-log__line.is-ok{color:var(--success);font-weight:600}
.adm-log__line.is-bad{color:var(--danger);font-weight:600}

/* ---------------- email templates ---------------- */
.adm-tpl.is-active{background:var(--surface-tint)}
.adm-tpl.is-active .listrow__ico{background:var(--accent);color:var(--on-accent)}
.adm-tpl__t{display:flex;align-items:center;gap:var(--s2)}
.adm-tpl__mod{height:20px;padding:0 8px;font-size:var(--fs-xxs)}

.adm-textarea{min-height:260px;font-size:var(--fs-sm);line-height:1.6}

.adm-vars{margin:0 0 var(--s4)}
.adm-vars__l{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--text-2);margin-bottom:var(--s2)}
.adm-vars__list{display:flex;flex-wrap:wrap;gap:var(--s2)}
.adm-var{
  height:30px;padding:0 10px;border-radius:var(--r-xs);
  display:inline-flex;align-items:center;
  background:var(--surface-2);border:1px solid var(--border);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs-xs);color:var(--accent-2);
  transition:border-color var(--t-fast),background-color var(--t-fast),transform var(--t-fast);
}
.adm-var:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}

.adm-preview{overflow:hidden}
.adm-preview__head{padding:var(--s4);background:var(--surface-2);border-bottom:1px solid var(--divider)}
.adm-preview__meta{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-xs);color:var(--text-2);min-width:0}
.adm-preview__meta + .adm-preview__meta{margin-top:3px}
.adm-preview__meta span:first-child{width:40px;flex:none;font-weight:600;color:var(--text-3)}
.adm-preview__subject{font-size:var(--fs-h3);font-weight:700;margin-top:var(--s3);line-height:var(--lh-snug)}
.adm-preview__body{
  padding:var(--s4);font-size:var(--fs-sm);line-height:1.65;
  white-space:pre-wrap;word-break:break-word;
}
.adm-var-hit{background:var(--accent-soft);color:var(--text);border-radius:4px;padding:0 3px}
.adm-var-miss{background:var(--danger-soft);color:var(--danger);border-radius:4px;padding:0 3px;font-weight:600}

/* ---------------- settings ---------------- */
.adm-toggle{display:flex;align-items:center;gap:var(--s3);padding:var(--s4)}
.adm-toggle + .adm-toggle{border-top:1px solid var(--divider)}
.adm-toggle__t{display:block;font-size:var(--fs-h3);font-weight:600;line-height:var(--lh-snug)}
.adm-toggle__s{display:block;font-size:var(--fs-xs);color:var(--text-2);margin-top:2px;line-height:1.45}

.adm-danger{border-color:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 32%,var(--border))}
.adm-danger__title{display:flex;align-items:center;gap:var(--s2);color:var(--danger)}
.adm-danger__title .ico{width:18px;height:18px}
.adm-danger__row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4)}
.adm-danger__row + .adm-danger__row{border-top:1px solid var(--divider)}
.adm-danger__row .btn{flex:none}
.adm-danger__t{display:block;font-size:var(--fs-h3);font-weight:600;line-height:var(--lh-snug)}
.adm-danger__s{display:block;font-size:var(--fs-xs);color:var(--text-2);margin-top:2px;line-height:1.45}

/* ==========================================================
   NARROW  < 520px  - stack buttons full width
   ========================================================== */
@media (max-width:519px){
  .adm-actions{flex-direction:column-reverse;align-items:stretch}
  .adm-actions .btn{width:100%}
  .adm-danger__row{flex-wrap:wrap}
  .adm-danger__row .grow{flex-basis:100%}
  .adm-danger__row .btn{width:100%}
  .adm-modal__acts .btn{flex-basis:calc(50% - var(--s1))}
}

/* ==========================================================
   MOBILE  < 720px  - the user table collapses into cards
   ========================================================== */
@media (max-width:719px){
  .adm-table{min-width:0}
  .adm-table,.adm-table tbody,.adm-table tr,.adm-table td{display:block;white-space:normal}
  .adm-table thead{display:none}
  .adm-table tbody tr{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);box-shadow:var(--sh-card);
    padding:var(--s3) var(--s4);margin-bottom:var(--s3);
  }
  .adm-table tbody tr:hover{background:var(--surface)}
  .adm-table tbody tr:last-child{margin-bottom:0}
  .adm-table td{
    display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
    padding:var(--s2) 0;border-bottom:1px solid var(--divider);
  }
  .adm-table tbody tr:last-child td{border-bottom:1px solid var(--divider)}
  .adm-table td[data-label]::before{
    content:attr(data-label);flex:none;
    font-size:var(--fs-xs);font-weight:600;color:var(--text-3);
  }
  .adm-table td.adm-td-user{padding:var(--s1) 0 var(--s3)}
  .adm-table td.adm-td-email{display:none}
  .adm-table td.adm-td-acts,.adm-table tbody tr:last-child td.adm-td-acts{
    width:auto;border-bottom:0;padding:var(--s3) 0 var(--s1);justify-content:flex-end;gap:var(--s2);
  }
  .adm-td-acts .iconbtn{margin-left:0}
  .adm-user{width:100%}
}

/* ==========================================================
   TABLET  >= 720px
   ========================================================== */
@media (min-width:720px){
  .adm-stats{grid-template-columns:repeat(4,1fr);gap:var(--s4)}
  .adm-quick{grid-template-columns:repeat(4,1fr)}
  .adm-form2{grid-template-columns:1fr 1fr}
  .adm-presets{flex-direction:row;align-items:center;gap:var(--s3)}
  .adm-toolbar{flex-direction:row;align-items:center}
  .adm-toolbar__search{flex:1;min-width:0}
  .adm-toolbar .chips{flex:none}
  .adm-tablewrap{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);box-shadow:var(--sh-card);
  }
  .adm-user__e{display:none}
}

/* ==========================================================
   DESKTOP  >= 1024px  - multi-column layouts
   ========================================================== */
@media (min-width:1024px){
  .adm-nav{margin-top:var(--s4)}
  .adm-two{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s6);align-items:start}
  .adm-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 var(--s6);align-items:start}
  .adm-split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0 var(--s6);align-items:start}
  .adm-split__list{position:sticky;top:calc(var(--topbar-h) + var(--s4))}
  .adm-split__main > .sec:first-child{margin-top:var(--s6)}
}

@media (min-width:1400px){
  .adm-split{grid-template-columns:320px minmax(0,1fr)}
  .adm-cols{grid-template-columns:minmax(0,1fr) 380px}
}

/* ==========================================================
   ADMIN CONSOLE SHELL (admin.html)
   The console has five sections, one more than the user app,
   so its tab bar needs its own column count.
   ========================================================== */
.adm-tabbar{grid-template-columns:repeat(5,1fr)}
.adm-tabbar .tabbar__btn{font-size:11px;gap:3px}
.adm-tabbar .tabbar__btn .ico{width:20px;height:20px}

/* the console has no floating "+" */
.adm-app .fab{display:none}

/* Console controls remain usable on touch devices and narrow laptops. */
.adm-td-acts .iconbtn{width:44px;height:44px}
.adm-rowbtn,.adm-menu__item,.adm-var{height:auto;min-height:44px}
.adm-pill--info,.adm-pill--warn,.adm-var{color:var(--accent-text)}
.adm-kv__v,.adm-modal__e,.adm-user__n,.adm-note__s,.adm-feed__t,.adm-intro__s{overflow-wrap:anywhere}
.adm-two > *,.adm-stats > *{min-width:0}
.adm-menu{max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow-y:auto}
@media (min-width:1024px) and (max-width:1279px){
  .adm-cols{grid-template-columns:minmax(0,1fr)}
  .adm-split{grid-template-columns:220px minmax(0,1fr);gap:var(--s4)}
  .adm-toolbar{flex-wrap:wrap}
  .adm-toolbar__search{flex-basis:100%}
}
@media (max-width:479px){
  .adm-kv__row{flex-wrap:wrap}
  .adm-kv__v{max-width:100%;margin-left:auto}
  .adm-modal__acts .btn{flex-basis:100%}
}

/* section chips duplicate the sidebar on desktop */
@media (min-width:1024px){
  .adm-app .adm-nav{display:none}
}


/* ===== css/bootstrap-interop.css ===== */
/* ==========================================================
   AURA FIT x BOOTSTRAP 5.3 — INTEROP LAYER
   ----------------------------------------------------------
   Architecture: Bootstrap supplies the normalize/Reboot base,
   the grid (.container/.row/.col-*), the utility classes and
   the JS plugins. Aura Fit's design system is the theme layer
   that sits on top and owns the component look.

   Seven class names exist in both libraries. Our flex helpers
   .row/.col were renamed to .af-row/.af-col so Bootstrap's
   grid stays fully usable; the remaining five are component
   names that we deliberately re-skin, the same way any
   Bootstrap theme does.

   This file MUST load last. Bootstrap's own rules are more
   specific in a few places, so some overrides are written at
   matching specificity on purpose.
   ========================================================== */

/* ----------------------------------------------------------
   1. REBOOT — we manage our own vertical rhythm
   Bootstrap adds margin-bottom to headings, p, ul, ol, etc.
   The app was built on a zero-margin baseline.
   ---------------------------------------------------------- */
h1, h2, h3, h4, h5, h6,
p, ul, ol, dl, dd, figure, blockquote, pre, hr, fieldset {
  margin: 0;
}
ul, ol { padding-left: 0; }

/* Bootstrap sets fluid display sizes on h1-h6; every heading in
   the app is sized by its own class, so inherit by default. */
h1, h2, h3, h4, h5, h6 {
  font-size: inherit;
  font-weight: 700;
  line-height: var(--lh-tight);
  letter-spacing: -.02em;
}

/* Reboot recolours body text and links from Bootstrap's palette */
body { color: var(--text); background-color: var(--bg); }
a { color: inherit; text-decoration: none; }
a:hover { color: inherit; }

/* Reboot forces a light form palette */
.input, .select, .textarea, input, select, textarea {
  background-color: var(--surface);
  color: var(--text);
}
.a-field input, .searchbar input { background-color: transparent; }

/* ----------------------------------------------------------
   2. .btn — Bootstrap's button base leaks line-height and colour
   ---------------------------------------------------------- */
.btn {
  line-height: 1.35;
  vertical-align: middle;
  text-decoration: none;
  --bs-btn-padding-x: 0;
  --bs-btn-padding-y: 0;
}
.btn:focus, .btn:active, .btn:focus-visible { box-shadow: none; }
.btn:active { top: auto; }

/* Keep Bootstrap's hover/active/focus colours inside the Aura palette.
   Without these mappings Bootstrap turns primary-button labels dark
   on their dark fill and makes keyboard-focused buttons transparent. */
.btn{--af-btn-bg:transparent;--af-btn-fg:var(--text);--af-btn-border:transparent}
.btn--primary{--af-btn-bg:var(--primary);--af-btn-fg:var(--on-primary)}
.btn--accent{--af-btn-bg:var(--accent);--af-btn-fg:var(--on-accent)}
.btn--soft{--af-btn-bg:var(--surface-tint)}
.btn--ghost,.sheet__save{--af-btn-bg:var(--surface);--af-btn-border:var(--border)}
.btn--quiet{--af-btn-fg:var(--text-2)}
.btn--danger{--af-btn-bg:var(--danger-soft);--af-btn-fg:var(--danger)}
.sheet__save.is-saved{--af-btn-bg:var(--accent-soft);--af-btn-fg:var(--accent-text);--af-btn-border:var(--accent)}
.btn{
  --bs-btn-hover-color:var(--af-btn-fg);
  --bs-btn-active-color:var(--af-btn-fg);
  --bs-btn-hover-bg:var(--af-btn-bg);
  --bs-btn-active-bg:var(--af-btn-bg);
  --bs-btn-hover-border-color:var(--af-btn-border);
  --bs-btn-active-border-color:var(--af-btn-border);
  --bs-btn-disabled-color:var(--af-btn-fg);
  --bs-btn-disabled-bg:var(--af-btn-bg);
  --bs-btn-disabled-border-color:var(--af-btn-border);
}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* ----------------------------------------------------------
   3. .card — Bootstrap makes it a flex column; ours is a block
   ---------------------------------------------------------- */
.card {
  display: block;
  position: relative;
  min-width: 0;
  height: auto;
  word-wrap: normal;
  background-clip: border-box;
}
/* compositional cards keep their own display mode */
.card.ootd { display: grid; }

/* ----------------------------------------------------------
   4. .badge — harmless overlap, just align it to our type
   ---------------------------------------------------------- */
.badge {
  vertical-align: middle;
  line-height: 1;
  text-align: left;
}

/* ----------------------------------------------------------
   5. .modal — Bootstrap hides it and pins it full-screen.
   Ours is the dialog surface INSIDE .modal-scrim, so raise the
   specificity to win cleanly.
   ---------------------------------------------------------- */
.modal-scrim .modal {
  position: relative;
  display: block;
  top: auto;
  left: auto;
  z-index: auto;
  width: 100%;
  height: auto;
  max-height:calc(100dvh - 40px);
  overflow-y:auto;
  overscroll-behavior:contain;
  outline: 0;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-pop);
}

/* ----------------------------------------------------------
   6. .toast — Bootstrap's `.toast:not(.show){display:none}` is
   (0,2,0) and would hide every toast we raise. Match it.
   ---------------------------------------------------------- */
.toast-layer .toast {
  display: flex;
  width: auto;
  max-width: 420px;
  opacity: 1;
  pointer-events: none;
  background-clip: border-box;
  background-color: var(--text);
  color: var(--bg);
  border: 0;
  box-shadow: var(--sh-pop);
  border-radius: var(--r-full);
}
.toast-layer .toast.is-out { opacity: 0; }

/* ----------------------------------------------------------
   7. Bootstrap component surfaces, themed to Aura Fit tokens
   so anything built with plain Bootstrap markup still matches.
   ---------------------------------------------------------- */
.table {
  --bs-table-color: var(--text);
  --bs-table-bg: transparent;
  --bs-table-border-color: var(--border);
  --bs-table-striped-color: var(--text);
  --bs-table-striped-bg: var(--surface-2);
  --bs-table-hover-color: var(--text);
  --bs-table-hover-bg: var(--surface-2);
}
.form-control, .form-select {
  background-color: var(--surface);
  border-color: var(--border);
  color: var(--text);
  border-radius: var(--r-sm);
}
.form-control:focus, .form-select:focus {
  background-color: var(--surface);
  border-color: var(--accent);
  color: var(--text);
  box-shadow: 0 0 0 3px var(--accent-ring);
}
.form-control::placeholder { color: var(--text-3); }
.dropdown-menu, .list-group-item, .offcanvas, .popover {
  background-color: var(--surface);
  color: var(--text);
  border-color: var(--border);
}
.text-muted { color: var(--text-2) !important; }
.border { border-color: var(--border) !important; }

/* Bootstrap's focus ring in our accent */
:root {
  --bs-focus-ring-color: var(--accent-ring);
  --bs-link-color: var(--accent-text);
  --bs-link-hover-color: var(--accent-2);
  --bs-border-color: var(--border);
  --bs-body-color: var(--text);
  --bs-body-bg: var(--bg);
  --bs-emphasis-color: var(--text);
  --bs-secondary-color: var(--text-2);
  --bs-tertiary-color: var(--text-3);
  --bs-primary: var(--accent);
}

</style>

    'Party':        { ico: 'i-star',    s: 'Statement pieces, evening ready.' },
    'Sporty':       { ico: 'i-refresh', s: 'Built to move.' },
    'Traditional':  { ico: 'i-tag',     s: 'Classic and occasion-led.' }
  };
  var STYLE_LIST = Object.keys(STYLE_META);
  var COLOUR_LIST = ['Ivory', 'Cream', 'Beige', 'Camel', 'Brown', 'Black', 'Charcoal', 'Grey',
                     'Navy', 'Denim blue', 'Sky', 'Olive', 'Sage', 'Blush', 'Rose', 'Maroon',
                     'Mustard', 'Rust', 'Lavender', 'Plum'];
  var OCC_LIST = ['Everyday', 'College', 'Office', 'Party', 'Date night', 'Travel', 'Wedding', 'Workout'];
  var FITS = [
    { id: 'Fitted',  s: 'Close to the body.' },
    { id: 'Regular', s: 'True to size.' },
    { id: 'Relaxed', s: 'Loose and easy.' },
    { id: 'Oversized', s: 'Deliberately roomy.' }
  ];

  var draft = null, step = 0, editing = false;

  var STEPS = [
    {
      q: 'How would you describe your style?',
      hint: 'Pick up to three. This shapes every suggestion you get.',
      key: 'styles', multi: true, max: 3,
      render: function () {
        return '<div class="optgrid">' + STYLE_LIST.map(function (s) {
          var m = STYLE_META[s];
          var on = draft.styles.indexOf(s) >= 0;
          return '<button class="opt' + (on ? ' is-active' : '') + '" data-val="' + U.esc(s) + '">' +
            '<span class="opt__ico">' + U.icon(m.ico) + '</span>' +
            '<span class="opt__t">' + U.esc(s) + '</span>' +
            '<span class="opt__s">' + U.esc(m.s) + '</span>' +
          '</button>';
        }).join('') + '</div>';
      }
    },
    {
      q: 'Which colours do you actually wear?',
      hint: 'Choose the shades you reach for most. Pick at least three.',
      key: 'colours', multi: true, max: 8,
      render: function () {
        return '<div class="swatches" style="gap:14px">' + COLOUR_LIST.map(function (c) {
          var hex = D.colourHex(c);
          var on = draft.colours.indexOf(c) >= 0;
          var check = w.Garments.luma(hex) > 0.6 ? '#222' : '#fff';
          return '<button class="swatch' + (on ? ' is-active' : '') + '" data-val="' + U.esc(c) + '" ' +
            'title="' + U.esc(c) + '" aria-label="' + U.esc(c) + '" ' +
            'style="background:' + hex + ';--swatch-check:' + check + '"></button>';
        }).join('') + '</div>' +
        '<p class="t-xs t-faint" style="margin-top:16px" data-picked></p>';
      }
    },
    {
      q: 'Where do you need outfits most?',
      hint: 'Select every occasion that applies.',
      key: 'occasions', multi: true, max: 6,
      render: function () {
        return '<div class="chips" style="flex-wrap:wrap;overflow:visible">' + OCC_LIST.map(function (o) {
          var on = draft.occasions.indexOf(o) >= 0;
          return '<button class="chip' + (on ? ' is-active' : '') + '" data-val="' + U.esc(o) + '">' +
            U.esc(o) + '</button>';
        }).join('') + '</div>';
      }
    },
    {
      q: 'How do you like things to fit?',
      hint: 'One choice. You can change this later in your account.',
      key: 'fit', multi: false,
      render: function () {
        return '<div class="optgrid">' + FITS.map(function (f) {
          var on = draft.fit === f.id;
          return '<button class="opt' + (on ? ' is-active' : '') + '" data-val="' + U.esc(f.id) + '">' +
            '<span class="opt__t">' + U.esc(f.id) + '</span>' +
            '<span class="opt__s">' + U.esc(f.s) + '</span>' +
          '</button>';
        }).join('') + '</div>';
      }
    }
  ];

  Screens.onboarding = {
    shell: false,
    render: function () {
      var u = S.user();
      editing = !!(u && u.onboarded);
      draft = (u && u.prefs) ? JSON.parse(JSON.stringify(u.prefs))
                             : { styles: [], colours: [], occasions: [], fit: '' };
      draft.styles = draft.styles || []; draft.colours = draft.colours || [];
      draft.occasions = draft.occasions || []; draft.fit = draft.fit || '';
      step = 0;

      return '<div class="onb">' +
        '<div class="onb__top">' +
          '<button class="iconbtn" data-prev aria-label="Back">' + U.icon('i-left') + '</button>' +
          '<div class="stepper grow">' + STEPS.map(function (_, i) {
            return '<i class="' + (i === 0 ? 'is-on' : '') + '"></i>';
          }).join('') + '</div>' +
          '<button class="btn btn--quiet btn--sm" data-skip>' + (editing ? 'Cancel' : 'Skip') + '</button>' +
        '</div>' +
        '<div class="onb__body" data-body></div>' +
        '<div class="onb__foot">' +
          '<button class="btn btn--primary btn--block btn--lg" data-next>Continue</button>' +
        '</div>' +
      '</div>';
    },

    mount: function (root) {
      var body = root.querySelector('[data-body]');
      var next = root.querySelector('[data-next]');
      var dots = U.$$('.stepper i', root);

      function valid() {
        var s = STEPS[step];
        if (s.key === 'fit') return !!draft.fit;
        if (s.key === 'colours') return draft.colours.length >= 3;
        return draft[s.key].length >= 1;
      }

      function paint() {
        var s = STEPS[step];
        body.innerHTML =
          '<div class="anim-in">' +
            '<h1 class="onb__q">' + U.esc(s.q) + '</h1>' +
            '<p class="onb__hint">' + U.esc(s.hint) + '</p>' +
            s.render() +
          '</div>';
        dots.forEach(function (d, i) { d.classList.toggle('is-on', i <= step); });
        /* step 0 has nowhere to go back to for a signed-in user */
        var prevBtn = root.querySelector('[data-prev]');
        if (prevBtn) prevBtn.style.visibility = step === 0 ? 'hidden' : '';
        next.textContent = step === STEPS.length - 1 ? 'Finish setup' : 'Continue';
        next.classList.toggle('is-disabled', !valid());
        next.disabled = !valid();
        U.$$('[data-val]', body).forEach(function (button) { button.setAttribute('aria-pressed', String(button.classList.contains('is-active'))); });
        paintPicked();
      }

      function paintPicked() {
        var t = body.querySelector('[data-picked]');
        if (!t) return;
        t.textContent = draft.colours.length
          ? draft.colours.length + ' selected · ' + draft.colours.join(', ')
          : 'Pick at least three colours to continue.';
      }

      U.on(body, 'click', '[data-val]', function (e, t) {
        var s = STEPS[step], v = t.dataset.val;
        if (!s.multi) {
          draft[s.key] = v;
        } else {
          var arr = draft[s.key];
          var i = arr.indexOf(v);
          if (i >= 0) arr.splice(i, 1);
          else {
            if (arr.length >= s.max) { U.toast('You can pick up to ' + s.max + '.', 'error'); return; }
            arr.push(v);
          }
        }
        paint();
        var focused = U.$$('[data-val]', body).filter(function (button) { return button.dataset.val === v; })[0];
        if (focused) focused.focus({ preventScroll: true });
      });

      next.onclick = function () {
        if (!valid()) { U.toast('Make a selection to continue.', 'error'); return; }
        if (step < STEPS.length - 1) { step++; paint(); return; }
        S.updateUser({ prefs: draft, onboarded: true });
        U.toast('Your style profile is ready', 'success');
        w.Router.go(editing ? '#/account' : '#/home');
      };

      root.querySelector('[data-prev]').onclick = function () {
        if (step === 0) return;
        step--; paint();
      };

      root.querySelector('[data-skip]').onclick = function () {
        if (editing) { w.Router.go('#/account'); return; }
        S.updateUser({
          prefs: { styles: ['Casual'], colours: ['Black', 'White', 'Denim blue'], occasions: ['Everyday'], fit: 'Regular' },
          onboarded: true
        });
        w.Router.go('#/home');
      };

      paint();
    }
  };
})(window);


/* ===== js/screens/home.js ===== */
/* ==========================================================
   SCREENS - HOME / DASHBOARD
   Personalised outfit for the selected day, wardrobe overview,
   outfit ideas rail and style stats.

(function (w) {
  'use strict';
  var U = w.UI, S = w.Store, D = w.Data, R = w.Recommend, G = w.Garments;
  var Screens = w.Screens = w.Screens || {};

  var selectedKey = null;

  /* 7-day strip centred on today */
  function days() {
    var out = [], today = new Date();
    for (var i = -2; i <= 4; i++) {
      var d = new Date(today);
      d.setDate(today.getDate() + i);
      out.push({ date: d, key: S.dateKey(d), isToday: i === 0 });

  }

  function ootdCard() {
    var res = R.outfitForDate(selectedKey);

      '</div></div>';
    }
    var o = res.outfit;

    return '<div class="card ootd">' +

      '</button>' +
      '<div class="ootd__body">' +
        '<div class="ootd__meta">' +
          '<span class="badge">' + U.icon('i-sparkle') + (res.planned ? 'Planned' : 'Suggested') + '</span>' +
          '<span class="badge badge--muted">' + U.esc(o.occasion) + '</span>' +
        '</div>' +
        '<div class="ootd__name">' + U.esc(o.name) + '</div>' +
        '<div class="ootd__why">' + U.esc(R.whyOutfit(o)) + '</div>' +
        '<div class="ootd__acts">' +
          '<button class="btn btn--primary btn--sm grow" data-go="#/outfit/' + o.id + '">View outfit</button>' +
          '<button class="btn btn--ghost btn--sm" data-shuffle aria-label="Suggest another">' + U.icon('i-refresh', 'ico--sm') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  Screens.home = {
    shell: true,
    tab: 'home',
    topbar: function () {
      var u = S.user();
      return {
        left: '<div class="brand only-mobile">' +
                '<span class="brand__mark">' + U.icon('i-hanger') + '</span>' +
              '</div>' +
              /* reserved for a future three-dot menu - intentionally inert */
              '<div class="topbar__future" data-future-menu></div>',
        title: 'Aura Fit',
        right: '<button class="iconbtn" data-theme-toggle aria-label="Switch theme">' +
                 U.icon(S.effectiveTheme() === 'dark' ? 'i-sun' : 'i-moon') + '</button>'
      };
    },

    render: function () {
      var u = S.user() || { name: 'there' };
      var st = S.stats();
      if (!days().some(function (d) { return d.key === selectedKey; })) selectedKey = S.dateKey();

      var chips = ['All'].concat(D.CATEGORIES.slice(0, 4).map(function (c) { return c.label; }));

      return '' +
      '<div class="greet">' +
        '<h1 class="greet__hi">' + U.esc(U.greeting()) + ', ' + U.esc(String(u.name).split(' ')[0]) +
          U.icon('i-sun') + '</h1>' +
        '<p class="greet__sub">Make every outfit your best outfit.</p>' +
      '</div>' +

      '<div class="home__search">' +
        '<label class="searchbar">' +
          '<span class="searchbar__ico">' + U.icon('i-search') + '</span>' +
          '<input type="search" placeholder="Search in wardrobe" data-search aria-label="Search wardrobe">' +
        '</label>' +
        '<button class="iconbtn iconbtn--bordered" data-go="#/wardrobe" aria-label="Filters">' + U.icon('i-sliders') + '</button>' +
      '</div>' +

      '<div class="chips">' + chips.map(function (c, i) {
        var target = i === 0 ? '#/wardrobe' : '#/wardrobe/' + D.CATEGORIES[i - 1].id;
        return '<button class="chip' + (i === 0 ? ' is-active' : '') + '" data-go="' + target + '">' + U.esc(c) + '</button>';
      }).join('') + '</div>' +

      /* ---- calendar strip ---- */
      '<div class="calstrip">' +
        '<div class="sec__head">' +
          '<div class="sec__title">Your day</div>' +
          '<span class="sec__link" data-today-label>' + U.fmtDate(new Date(selectedKey + 'T00:00:00')) + '</span>' +
        '</div>' +
        '<div class="calstrip__days">' + days().map(function (d) {
          return '<button class="calday' + (d.key === selectedKey ? ' is-active' : '') + (d.isToday ? ' is-today' : '') + '" data-day="' + d.key + '">' +
            '<div class="calday__d">' + U.DAYS[d.date.getDay()] + '</div>' +
            '<div class="calday__n">' + d.date.getDate() + '</div>' +
          '</button>';
        }).join('') + '</div>' +
      '</div>' +

      '<div class="sec" data-ootd>' + ootdCard() + '</div>' +

      /* ---- wardrobe overview ---- */
      '<div class="sec">' +
        '<div class="card card--pad">' +
          '<div class="sec__head" style="margin-bottom:14px">' +
            '<div class="sec__title">Wardrobe Overview</div>' +
            '<button class="sec__link" data-go="#/wardrobe">See All ' + U.icon('i-right') + '</button>' +
          '</div>' +
          '<div class="stats3">' +
            '<div class="stat"><div class="stat__n">' + st.items + '</div><div class="stat__l">Items</div>' +
              '<span class="stat__ico">' + U.icon('i-bag') + '</span></div>' +
            '<div class="stat"><div class="stat__n">' + st.outfits + '</div><div class="stat__l">Outfits</div>' +
              '<span class="stat__ico">' + U.icon('i-hanger') + '</span></div>' +
            '<div class="stat"><div class="stat__n">' + st.categories + '</div><div class="stat__l">Categories</div>' +
              '<span class="stat__ico">' + U.icon('i-grid') + '</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      /* ---- outfit ideas rail ---- */
      '<div class="sec">' +
        '<div class="sec__head">' +
          '<div class="sec__title">Outfit Ideas</div>' +
          '<button class="sec__link" data-go="#/ideas">See All ' + U.icon('i-right') + '</button>' +
        '</div>' +
        (S.state.outfits.length ? '' :
          '<div class="card card--pad"><div class="empty" style="padding:20px 0">' +
            '<div class="empty__ico">' + U.icon('i-hanger', 'ico--lg') + '</div>' +
            '<div class="empty__t">No outfits yet</div>' +
            '<div class="empty__s">Combine a few pieces and your looks will appear here.</div>' +
            '<button class="btn btn--primary btn--sm" data-go="#/add?mode=outfit">Build an outfit</button>' +
          '</div></div>') +
        '<div class="scroll-x ideas-rail stagger"' + (S.state.outfits.length ? '' : ' hidden') + '>' +
        S.state.outfits.slice(0, 8).map(function (o) {
          var parts = S.outfitParts(o);
          return '<button class="ideacard" data-go="#/outfit/' + o.id + '">' +
            '<span class="ideacard__thumb">' + G.outfit(parts, { label: o.name }) + '</span>' +
            '<span class="ideacard__name">' + U.esc(o.name) + '</span>' +
            '<span class="ideacard__meta">' + U.esc(o.occasion) + ' · ' + o.items.length + ' pieces</span>' +
          '</button>';
        }).join('') + '</div>' +
      '</div>' +

      /* ---- style stats ---- */
      '<div class="sec">' +
        '<div class="card card--pad">' +
          '<div class="sec__head" style="margin-bottom:14px">' +
            '<div class="sec__title">Style Stats</div>' +
            '<button class="sec__link" data-go="#/stats">View stats ' + U.icon('i-right') + '</button>' +
          '</div>' +
          '<div class="styleStat">' +
            U.donut(st.usagePct, 76, 9) +
            '<div class="grow">' +
              '<div class="styleStat__t">Wardrobe Used</div>' +
              '<div class="styleStat__s">' + st.usagePct + '% of your wardrobe appears in saved outfits.</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    },

    mount: function (view) {
      /* day selection re-renders only the outfit block */
      U.on(view, 'click', '[data-day]', function (e, t) {
        selectedKey = t.dataset.day;
        U.$$('.calday', view).forEach(function (b) {
          b.classList.toggle('is-active', b.dataset.day === selectedKey);
        });
        var host = view.querySelector('[data-ootd]');
        host.innerHTML = ootdCard();
        var lbl = view.querySelector('[data-today-label]');
        if (lbl) lbl.textContent = U.fmtDate(new Date(selectedKey + 'T00:00:00'));
      });

      /* shuffle -> plan a different outfit for this day */
      U.on(view, 'click', '[data-shuffle]', function () {
        var list = S.state.outfits;
        if (list.length < 2) return U.toast('Add more outfits to shuffle.', 'error');
        var cur = R.outfitForDate(selectedKey);
        var pick;
        do { pick = list[Math.floor(Math.random() * list.length)]; }
        while (cur && pick.id === cur.outfit.id);
        S.setPlan(selectedKey, pick.id);
        view.querySelector('[data-ootd]').innerHTML = ootdCard();
        U.toast('Switched to ' + pick.name, 'success');
      });

      var search = view.querySelector('[data-search]');
      if (search) {
        search.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && search.value.trim()) {
            w.Router.go('#/wardrobe?q=' + encodeURIComponent(search.value.trim()));
          }
        });
      }
    }
  };
})(window);


/* ===== js/screens/wardrobe.js ===== */
/* ==========================================================
   SCREENS - WARDROBE
   Clothes + saved outfits. "All" shows the category grid from
   the reference kit; a category tab shows the item grid.
   ========================================================== */
(function (w) {
  'use strict';
  var U = w.UI, S = w.Store, D = w.Data, G = w.Garments;
  var Screens = w.Screens = w.Screens || {};

  var mode = 'items';     // items | outfits
  var cat = 'all';
  var query = '';
  var searchTimer = null;

  function matches(i) {
    if (cat !== 'all' && i.cat !== cat) return false;
    if (!query) return true;
    var q = query.toLowerCase();
    return [i.name, i.brand, i.colorName, i.style, i.occasion, i.notes]
      .filter(Boolean).some(function (v) { return String(v).toLowerCase().indexOf(q) >= 0; });
  }

  function itemCard(i) {
    return '<button class="itemcard" data-go="#/item/' + i.id + '">' +
      '<span class="itemcard__thumb">' +
        (i.photo
          ? '<img src="' + i.photo + '" alt="' + U.esc(i.name) + '" style="width:100%;height:100%;object-fit:cover">'
          : G.garment({ color: i.color, kind: i.kind, cat: i.cat, label: i.name })) +
      '</span>' +
      '<span class="itemcard__name trunc">' + U.esc(i.name) + '</span>' +
      '<span class="itemcard__meta">' +
        '<i class="itemcard__dot" style="background:' + i.color + '"></i>' +
        U.esc(i.colorName) + (i.brand ? ' · ' + U.esc(i.brand) : '') +
      '</span>' +
    '</button>';
  }

  function outfitCard(o) {
    var parts = S.outfitParts(o);
    var fav = S.isFavOutfit(o.id);
    return '<div class="outfitcard">' +
      '<button class="fav' + (fav ? ' is-on' : '') + '" data-fav="' + o.id + '" aria-pressed="' + (fav ? 'true' : 'false') + '" aria-label="Favourite ' + U.esc(o.name) + '">' + U.icon('i-heart') + '</button>' +
      '<button class="outfitcard__link" data-go="#/outfit/' + o.id + '">' +
        '<span class="outfitcard__thumb">' + G.outfit(parts, { label: o.name }) + '</span>' +
        '<span class="outfitcard__name trunc">' + U.esc(o.name) + '</span>' +
        '<span class="outfitcard__meta">' + U.esc(o.occasion) + ' · ' + o.items.length + ' pieces</span>' +
      '</button>' +
    '</div>';
  }

  function body() {
    if (mode === 'outfits') {
      var outs = S.state.outfits.filter(function (o) {
        if (!query) return true;
        var q = query.toLowerCase();
        return (o.name + ' ' + o.occasion + ' ' + (o.notes || '')).toLowerCase().indexOf(q) >= 0;
      });
      if (!outs.length) return empty(query ? 'No matching outfits' : 'No saved outfits', query ? 'Try another name or occasion.' : 'Build a look from your wardrobe and it will show up here.');
      return '<div class="ideagrid stagger">' + outs.map(outfitCard).join('') + '</div>';
    }

    /* All -> category grid (reference screen 2) */
    if (cat === 'all' && !query) {
      return '<div class="catgrid stagger">' + D.CATEGORIES.map(function (c) {
        var list = S.itemsByCat(c.id);
        var sample = list[0];
        return '<button class="catcard" data-cat="' + c.id + '">' +
          '<span class="catcard__thumb">' +
            (sample ? G.garment({ color: sample.color, kind: sample.kind, cat: c.id, label: c.label })
                    : G.garment({ cat: c.id, label: c.label })) +
          '</span>' +
          '<span class="catcard__body">' +
            '<span class="catcard__name">' + U.esc(c.label) + '</span>' +
            '<span class="catcard__count">' + list.length + ' item' + (list.length === 1 ? '' : 's') + '</span>' +
          '</span>' +
        '</button>';
      }).join('') + '</div>';
    }

    var items = S.state.wardrobe.filter(matches);
    if (!items.length) {
      return empty(query ? 'No matches' : 'Nothing here yet',
        query ? 'Try a different search term.' : 'Tap the + button to add your first piece to this category.');
    }
    return '<div class="itemgrid stagger">' + items.map(itemCard).join('') + '</div>';
  }

  function empty(t, s) {
    return '<div class="empty">' +
      '<div class="empty__ico">' + U.icon('i-hanger', 'ico--lg') + '</div>' +
      '<div class="empty__t">' + U.esc(t) + '</div>' +
      '<div class="empty__s">' + U.esc(s) + '</div>' +
      (query ? '<button class="btn btn--primary btn--sm" data-clear-search>Clear search</button>' :
        '<button class="btn btn--primary btn--sm" data-go="#/add' + (mode === 'outfits' ? '?mode=outfit' : '') + '">' + (mode === 'outfits' ? 'Create an outfit' : 'Add an item') + '</button>') +
    '</div>';
  }

  Screens.wardrobe = {
    shell: true,
    tab: 'wardrobe',
    topbar: function () {
      return {
        left: '',
        title: 'My Wardrobe',
        right: '<button class="iconbtn" data-search-toggle aria-label="Search">' + U.icon('i-search') + '</button>' +
               '<button class="iconbtn" data-go="#/stats" aria-label="Wardrobe stats">' + U.icon('i-sliders') + '</button>'
      };
    },

    render: function (params) {
      cat = D.CATEGORIES.some(function (c) { return c.id === params.cat; }) ? params.cat : 'all';
      query = params.q || '';
      mode = params.mode === 'outfits' ? 'outfits' : 'items';

/* ===== js/screens/item.js ===== */
/* ==========================================================
   SCREENS - ITEM DETAIL / OUTFIT SELECTION
   Shows the uploaded photo, lets the user confirm the clothing
   category (Top / Bottom / Shoes) and offers the two primary
   actions: Find Similar and Find Pair. Both open the
   bottom-sheet product panel.
   ========================================================== */
(function (w) {
  'use strict';
  var U = w.UI, S = w.Store, D = w.Data, R = w.Recommend, G = w.Garments;
  var Screens = w.Screens = w.Screens || {};

  var PICKS = [
    { id: 'top',    label: 'Top',    icon: 'i-shirt' },
    { id: 'bottom', label: 'Bottom', icon: 'i-pants' },
    { id: 'shoes',  label: 'Shoes',  icon: 'i-shoe'  }
  ];

  /* dresses / layers / bags behave as a "top" for pairing purposes */
  function normalise(cat) {
    if (cat === 'bottom') return 'bottom';
    if (cat === 'shoes') return 'shoes';
    return 'top';
  }

  var pick = 'top';
  var current = null;

  function heroArt(i) {
    return i.photo
      ? '<img src="' + i.photo + '" alt="' + U.esc(i.name) + '" style="width:100%;height:100%;object-fit:cover">'
      : G.garment({ color: i.color, kind: i.kind, cat: i.cat, label: i.name });
  }

  /* ---------- Find Similar ---------- */
  function openSimilar(item) {
    var probe = Object.assign({}, item, { cat: pickToCat(item) });
    var all = R.findSimilar(probe, 24);
    U.Sheet.open({
      title: 'Similar to ' + item.name,
      sub: 'Matched on colour, cut and style from the sample catalogue.',
      tabs: [
        { id: 'close', label: 'Closest Match', items: all.slice(0, 8) },
        { id: 'more',  label: 'More Like This', items: all.slice(8, 24) }
      ]
    });
  }

  /* ---------- Find Pair ---------- */
  function openPair(item) {
    var base = normalise(pick);
    var targets = R.pairTargets(base);
    var probe = Object.assign({}, item);
    U.Sheet.open({
      title: 'Pairs with your ' + (item.name || 'item'),
      sub: 'Selected ' + PICKS.filter(function (p) { return p.id === base; })[0].label.toLowerCase() +
           ' → matching ' + targets.map(function (t) { return D.catLabel(t).toLowerCase(); }).join(' and ') + '.',
      tabs: targets.map(function (t) {
        return { id: t, label: D.catLabel(t), items: R.findPair(probe, t, 14) };
      })
    });
  }

  /* the category the user picked drives what "similar" means */
  function pickToCat(item) {
    if (pick === 'bottom') return 'bottom';
    if (pick === 'shoes') return 'shoes';
    /* keep the true category when it is already a top-family item */
    return (item.cat === 'dress' || item.cat === 'outerwear' || item.cat === 'top') ? item.cat : 'top';
  }

  Screens.item = {
    shell: true,
    tab: 'wardrobe',
    topbar: function (params) {
      var i = S.getItem(params.id);

        back: true,

        right: '<button class="iconbtn" data-share aria-label="Share">' + U.icon('i-share') + '</button>'
      };
    },

    render: function (params) {
      var i = S.getItem(params.id);
      current = i;
      if (!i) {
        return '<div class="empty"><div class="empty__ico">' + U.icon('i-x', 'ico--lg') + '</div>' +
          '<div class="empty__t">Item not found</div>' +
          '<div class="empty__s">It may have been removed from your wardrobe.</div>' +
          '<button class="btn btn--primary btn--sm" data-go="#/wardrobe">Back to wardrobe</button></div>';
      }
      pick = normalise(i.cat);

      return '' +
      '<div class="detail__grid">' +
        '<div class="detail__hero anim-in">' + heroArt(i) + '</div>' +

        '<div>' +
          '<h1 class="detail__title">' + U.esc(i.name) + '</h1>' +
          '<div class="detail__meta">' +
            '<span class="badge"><i class="itemcard__dot" style="background:' + i.color + '"></i>' + U.esc(i.colorName) + '</span>' +
            '<span class="badge badge--muted">' + U.esc(D.catLabel(i.cat)) + '</span>' +
            (i.brand ? '<span class="badge badge--muted">' + U.esc(i.brand) + '</span>' : '') +
          '</div>' +

          /* ---- category selection ---- */
          '<div class="sec">' +
            '<div class="sec__head"><div class="sec__title">Clothing category</div></div>' +
            '<div class="catpick">' + PICKS.map(function (p) {
              return '<button class="catpick__btn' + (p.id === pick ? ' is-active' : '') + '" aria-pressed="' + (p.id === pick) + '" data-pick="' + p.id + '">' +
                U.icon(p.icon) + '<span>' + p.label + '</span></button>';
            }).join('') + '</div>' +
            '<p class="t-xs t-faint" style="margin-top:10px" data-pickhint></p>' +
          '</div>' +

          /* ---- the two primary actions ---- */
          '<div class="finder">' +
            '<button class="btn btn--ghost btn--lg" data-similar>' + U.icon('i-search') + ' Find Similar</button>' +
            '<button class="btn btn--primary btn--lg" data-pair>' + U.icon('i-sparkle') + ' Find Pair</button>' +
          '</div>' +

          /* ---- details ---- */
          '<div class="deflist">' +
            row('Colour', i.colorName) +
            row('Style', i.style) +
            row('Occasion', i.occasion) +
            row('Season', i.season) +
            (i.brand ? row('Brand', i.brand) : '') +
            row('Notes', i.notes || 'No notes added yet.') +
          '</div>' +

          '<div class="acts3">' +
            '<button class="actbtn" data-go="#/add?edit=' + i.id + '">' + U.icon('i-edit') + '<span>Edit</span></button>' +
            '<button class="actbtn actbtn--danger" data-remove>' + U.icon('i-trash') + '<span>Remove</span></button>' +
            '<button class="actbtn" data-share>' + U.icon('i-share') + '<span>Share</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
    },

    mount: function (view, params) {
      var i = S.getItem(params.id);
      if (!i) return;

      function hint() {
        var t = view.querySelector('[data-pickhint]');
        if (!t) return;
        var targets = R.pairTargets(normalise(pick));
        t.textContent = 'Find Pair will suggest matching ' +
          targets.map(function (x) { return D.catLabel(x).toLowerCase(); }).join(' and ') + '.';
      }
      hint();

      U.on(view, 'click', '[data-pick]', function (e, t) {
        pick = t.dataset.pick;
        U.$$('[data-pick]', view).forEach(function (b) {
          b.classList.toggle('is-active', b.dataset.pick === pick);
          b.setAttribute('aria-pressed', String(b.dataset.pick === pick));
        });
        hint();
      });

      U.on(view, 'click', '[data-similar]', function () { openSimilar(i); });
      U.on(view, 'click', '[data-pair]', function () { openPair(i); });

      U.on(view, 'click', '[data-remove]', function () {
        U.confirmDialog({
          title: 'Remove this item?',
          text: 'It will be taken out of your wardrobe and any outfits that use it.',
          ok: 'Remove', danger: true
        }).then(function (yes) {
          if (!yes) return;
          S.removeItem(i.id);
          U.toast('Item removed', 'success');
          w.Router.go('#/wardrobe');
        });
      });

      function share() {
        var text = i.name + ' — ' + i.colorName + ' ' + D.catLabel(i.cat).toLowerCase() + ' in my Aura Fit wardrobe.';
        U.shareText(text);
      }
      U.on(view, 'click', '[data-share]', share);
      var top = document.querySelector('.topbar [data-share]');
      if (top) top.onclick = share;
    }
  };

  function row(k, v) {
    return '<div class="defrow"><div class="defrow__k">' + U.esc(k) + '</div>' +
           '<div class="defrow__v">' + U.esc(v) + '</div></div>';
  }
})(window);

      '<select class="select" id="' + id + '">' + options.map(function (o) {
        var v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;

          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.width * s));
          cv.height = Math.max(1, Math.round(img.height * s));

      photoVersion++;

    },
    mount: function (view, params) {

        U.$$('[data-colour]', view).forEach(function (b) {
          b.classList.toggle('is-active', b.dataset.colour === name);
          b.setAttribute('aria-pressed', String(b.dataset.colour === name));
        });
        var lbl = view.querySelector('[data-colourlbl]');
        if (lbl) lbl.innerHTML = U.esc(name) +
          ' <span class="t-faint">· detected from your photo</span>';
      }

      U.on(view, 'click', '[data-pickfile],[data-repick]', function () { file.click(); });
      U.on(view, 'click', '[data-camera]', function () { cam.click(); });

      [file, cam].forEach(function (inp) {
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0];
          if (!f) return;
          upload(f);
          inp.value = '';
        });
      });

      /* drag & drop */
      ['dragenter', 'dragover'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) {
          e.preventDefault();
          var z = dz.querySelector('.dropzone'); if (z) z.classList.add('is-drag');
        });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) {
          e.preventDefault();
          var z = dz.querySelector('.dropzone'); if (z) z.classList.remove('is-drag');
        });
      });
      dz.addEventListener('drop', function (e) {
        var f = e.dataTransfer && e.dataTransfer.files[0];
        if (f) upload(f);
      });

      /* category -> type list */
      var catSel = view.querySelector('#f-cat');
      catSel.addEventListener('change', function () {
        form.cat = catSel.value;
        var ks = kindsFor(form.cat);
        form.kind = ks[0];
        view.querySelector('[data-kindwrap]').innerHTML =
          sel('f-kind', 'Type', ks.map(function (k) { return { v: k, t: kindLabel(k) }; }), form.kind);
      });

      U.on(view, 'click', '[data-colour]', function (e, t) {
        form.colorName = t.dataset.colour;
        dirty = true;
        U.$$('[data-colour]', view).forEach(function (b) {
          b.classList.toggle('is-active', b.dataset.colour === form.colorName);
          b.setAttribute('aria-pressed', String(b.dataset.colour === form.colorName));
        });
        view.querySelector('[data-colourlbl]').textContent = form.colorName;
      });

      function save() {
        if (photoBusy) return U.toast('Please wait for the photo to finish processing.');
        var name = view.querySelector('#f-name').value.trim();
        var cat = view.querySelector('#f-cat').value;
        var kind = view.querySelector('#f-kind').value;
        if (!name) {
          name = form.colorName + ' ' + kindLabel(kind);
        }
        var payload = {
          name: name, cat: cat, kind: kind,
          colorName: form.colorName, color: D.colourHex(form.colorName),
          style: view.querySelector('#f-style').value,
          occasion: view.querySelector('#f-occ').value,
          season: view.querySelector('#f-season').value,
          brand: view.querySelector('#f-brand').value.trim(),
          notes: view.querySelector('#f-notes').value.trim(),
          photo: photo
        };
        if (editId) {
          S.updateItem(editId, payload);
          dirty = false; initialValues = values(view);
          U.toast('Item updated', 'success');
          w.Router.go('#/item/' + editId);
        } else {
          var it = S.addItem(payload);
          dirty = false; initialValues = values(view);
          U.toast('Added to your wardrobe', 'success');
          w.Router.go('#/item/' + it.id);
        }
      }

      view.querySelector('[data-form]').addEventListener('submit', function (e) { e.preventDefault(); save(); });
      var topSave = document.querySelector('.topbar [data-save]');
      if (topSave) topSave.onclick = save;

      U.on(view, 'click', '[data-mode]', function (e, t) {
        w.Router.go('#/add' + (t.dataset.mode === 'outfit' ? '?mode=outfit' : ''), true);
      });
    }
  };

  /* ================= OUTFIT BUILDER ================= */
  function renderOutfit() {
    var wr = S.state.wardrobe;
    return '' +
    (editId ? '' : '<div class="segment" style="margin:8px 0 20px">' +
      '<button class="segment__btn" data-mode="item">' + U.icon('i-shirt', 'ico--sm') + ' Single item</button>' +
      '<button class="segment__btn is-active" data-mode="outfit">' + U.icon('i-hanger', 'ico--sm') + ' Complete outfit</button>' +
    '</div>') +

    '<div class="card card--pad" style="margin-bottom:20px">' +
      '<div class="af-row gap4">' +
        '<div class="thumb" style="width:110px;height:auto;flex:none" data-preview>' +
          w.Garments.outfit({}, { label: 'New outfit' }) + '</div>' +
        '<div class="grow">' +
          '<div class="t-bold" style="font-size:var(--fs-h2)">Build a look</div>' +
          '<div class="t-sm t-dim" style="margin-top:4px">Pick the pieces that go together. ' +
            '<span data-count>0</span> selected.</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<form data-form>' +
      '<div class="field">' +
        '<label class="field__label" for="o-name">Outfit name</label>' +
        '<input class="input" id="o-name" maxlength="120" value="' + U.esc(form.name) + '" placeholder="e.g. Casual Day Out">' +
      '</div>' +
      sel('o-occ', 'Occasion', D.OCCASIONS, form.occasion) +
      sel('o-season', 'Season', D.SEASONS, form.season) +
      '<div class="field">' +
        '<label class="field__label" for="o-notes">Notes</label>' +
        '<textarea class="textarea" id="o-notes" maxlength="1000" placeholder="When would you wear this?">' + U.esc(form.notes) + '</textarea>' +
      '</div>' +
    '</form>' +

    '<div class="sec">' +
      '<div class="sec__head"><div class="sec__title">Choose pieces</div>' +
        '<span class="sec__link" data-count2>0 selected</span></div>' +
      (wr.length
        ? '<div class="itemgrid">' + wr.map(function (i) {
            return '<button class="itemcard" data-toggle="' + i.id + '">' +
              '<span class="itemcard__thumb" style="position:relative">' +
                (i.photo ? '<img src="' + i.photo + '" alt="" style="width:100%;height:100%;object-fit:cover">'
                         : G.garment({ color: i.color, kind: i.kind, cat: i.cat, label: i.name })) +
                '<span class="prodcard__tick">' + U.icon('i-check') + '</span>' +
              '</span>' +
              '<span class="itemcard__name trunc">' + U.esc(i.name) + '</span>' +
              '<span class="itemcard__meta">' + U.esc(D.catLabel(i.cat)) + '</span>' +
            '</button>';
          }).join('') + '</div>'
        : '<div class="empty"><div class="empty__ico">' + U.icon('i-hanger', 'ico--lg') + '</div>' +
          '<div class="empty__t">Your wardrobe is empty</div>' +
          '<div class="empty__s">Add a few items first, then combine them into outfits.</div></div>') +
    '</div>' +

    '<button class="btn btn--primary btn--block btn--lg" style="margin-top:24px" data-saveoutfit>Save outfit</button>';
  }

  function mountOutfit(view) {
    function refresh() {
      U.$$('[data-toggle]', view).forEach(function (b) {
        b.classList.toggle('is-selected', picked.indexOf(b.dataset.toggle) >= 0);
        b.setAttribute('aria-pressed', String(picked.indexOf(b.dataset.toggle) >= 0));
      });
      var n = picked.length;
      var c1 = view.querySelector('[data-count]'), c2 = view.querySelector('[data-count2]');
      if (c1) c1.textContent = n;
      if (c2) c2.textContent = n + ' selected';
      var prev = view.querySelector('[data-preview]');
      if (prev) {
        prev.innerHTML = w.Garments.outfit(S.outfitParts({ items: picked }), { label: 'Preview' });
      }
    }

    U.on(view, 'click', '[data-toggle]', function (e, t) {
      var id = t.dataset.toggle;
      dirty = true;
      var i = picked.indexOf(id);
      if (i >= 0) picked.splice(i, 1);
      else {
        if (picked.length >= 6) return U.toast('An outfit can hold up to 6 pieces.', 'error');
        picked.push(id);
      }
      refresh();
    });

    function save() {
      if (picked.length < 2) return U.toast('Pick at least two pieces.', 'error');
      var name = view.querySelector('#o-name').value.trim();
      var payload = {
        name: name || 'New Outfit',
        items: picked.slice(),
        occasion: view.querySelector('#o-occ').value,
        season: view.querySelector('#o-season').value,
        notes: view.querySelector('#o-notes').value.trim()
      };
      var o = editId ? S.updateOutfit(editId, payload) : S.addOutfit(payload);
      dirty = false; initialValues = values(view);
      U.toast(editId ? 'Outfit updated' : 'Outfit saved', 'success');
      w.Router.go('#/outfit/' + o.id);
    }

    view.querySelector('[data-saveoutfit]').onclick = save;
    var topSave = document.querySelector('.topbar [data-save]');
    if (topSave) topSave.onclick = save;
    view.querySelector('[data-form]').addEventListener('submit', function (e) { e.preventDefault(); save(); });

    U.on(view, 'click', '[data-mode]', function (e, t) {
      w.Router.go('#/add' + (t.dataset.mode === 'outfit' ? '?mode=outfit' : ''), true);
    });

    refresh();
  }
})(window);

/* ===== js/screens/ideas.js ===== */
/* ==========================================================
   SCREENS - AI IDEAS / SUGGESTIONS
   Occasion tabs, recommended looks generated from the user's
   own wardrobe, and the AI Stylist natural-language panel.
   ========================================================== */
(function (w) {
  'use strict';
  var U = w.UI, S = w.Store, D = w.Data, R = w.Recommend, G = w.Garments;
  var Screens = w.Screens = w.Screens || {};

  var TABS = [
    { id: 'foryou', label: 'For You',  occ: null },
    { id: 'casual', label: 'Casual',   occ: 'Everyday' },
    { id: 'office', label: 'Office',   occ: 'Office' },
    { id: 'party',  label: 'Party',    occ: 'Party' },
    { id: 'other',  label: 'Other',    occ: 'Travel' }
  ];

  var active = 'foryou';
  var generated = [];
  var salt = 0;            // bumped by Regenerate so results actually change
  var savedByKey = {};     // generated key -> persisted outfit id (prevents duplicates)
  var answerTimer = null;

  function savedLook(o) {
    return S.state.outfits.filter(function (look) {
      return look.items.slice().sort().join('|') === o.key;
    })[0] || null;
  }

  function build(occ, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var o = R.buildOutfit(occ, i + salt);
      if (!o) break;
      var key = o.items.slice().sort().join('|');
      if (out.some(function (x) { return x.key === key; })) continue;
      o.key = key;
      o.name = nameFor(occ, i);
      out.push(o);
    }
    return out;
  }

  function nameFor(occ, i) {
    var pool = {
      'Office':     ['Desk to Dinner', 'Monday Sharp', 'Quiet Authority', 'Boardroom Ready',
                     'Deep Work', 'Client Ready', 'Soft Tailoring', 'Inbox Zero'],
      'Party':      ['Evening Out', 'After Hours', 'Night Shift', 'Late Table',
                     'Last Round', 'Neon Hour', 'House Lights', 'Encore'],
      'Everyday':   ['Easy Weekday', 'Coffee Run', 'Slow Sunday', 'Off Duty',
                     'Corner Shop', 'Long Walk', 'Quiet Morning', 'No Plans'],
      'Travel':     ['Airport Layers', 'Long Weekend', 'City Walk', 'Window Seat',
                     'Overnight Bag', 'Platform Nine', 'Coastal Road', 'Late Check-in'],
      'Date night': ['Soft Focus', 'Second Date', 'Golden Hour', 'Close Table',
                     'Slow Dinner', 'Candlelight', 'One More Drink', 'Walk Home']
    }[occ || 'Everyday'] || ['Fresh Pick', 'Balanced Look', 'Everyday Edit', 'Clean Lines',
                             'Quiet Palette', 'Soft Contrast', 'Tonal Study', 'Simple Lines'];
    return pool[i % pool.length];
  }

  function cardFor(o, idx) {
    var saved = savedLook(o), fav = saved && S.isFavOutfit(saved.id);
    return '<div class="outfitcard">' +
      '<button class="fav' + (fav ? ' is-on' : '') + '" data-save-look="' + idx + '" aria-pressed="' + !!fav + '" aria-label="Favourite ' + U.esc(o.name) + '">' + U.icon('i-heart') + '</button>' +
      '<button style="width:100%;text-align:left" data-open-look="' + idx + '">' +
        '<span class="outfitcard__thumb">' + G.outfit(o.parts, { label: o.name }) + '</span>' +
        '<span class="outfitcard__name trunc">' + U.esc(o.name) + '</span>' +
        '<span class="outfitcard__meta">' + U.icon('i-sparkle', 'ico--sm') + ' ' + o.score + '% match</span>' +
      '</button>' +
    '</div>';
  }

  function grid() {
    var tab = TABS.filter(function (t) { return t.id === active; })[0];
    generated = build(tab.occ, 8);

    if (!generated.length) {
      return '<div class="empty">' +
        '<div class="empty__ico">' + U.icon('i-sparkle', 'ico--lg') + '</div>' +
        '<div class="empty__t">Not enough pieces yet</div>' +
        '<div class="empty__s">Add a top and bottom (or a dress), plus shoes, to start composing complete looks.</div>' +
        '<button class="btn btn--primary btn--sm" data-go="#/add">Add an item</button>' +
      '</div>';
    }
    return '<div class="ideagrid stagger">' + generated.map(cardFor).join('') + '</div>';
  }

  Screens.ideas = {
    shell: true,
    tab: 'ideas',
    topbar: function () {
      return {
        left: '',
        title: 'Outfit Ideas',
        right: '<button class="iconbtn" data-regen aria-label="Regenerate">' + U.icon('i-refresh') + '</button>'
      };
    },

    render: function () {
      return '' +
      '<div class="tabs" style="margin:8px 0 20px">' + TABS.map(function (t) {
        return '<button class="tab' + (t.id === active ? ' is-active' : '') + '" data-tab="' + t.id + '">' +
          U.esc(t.label) + '</button>';
      }).join('') + '</div>' +

      '<div class="sec__head">' +
        '<div class="sec__title">Recommended for you</div>' +
        '<button class="sec__link" data-go="#/wardrobe?mode=outfits">My outfits ' + U.icon('i-right') + '</button>' +
      '</div>' +

      '<div data-grid>' + grid() + '</div>' +

      /* ---- AI stylist ---- */
      '<div class="stylist">' +
        '<div class="stylist__head">' + U.icon('i-sparkle') + '<span class="stylist__t">AI Stylist</span></div>' +
        '<p class="stylist__s">Tell me the occasion and I will put a look together from what you already own.</p>' +
        '<div class="stylist__prompts">' + D.PROMPTS.map(function (p) {
          return '<button class="stylist__prompt" data-prompt="' + U.esc(p) + '">' + U.esc(p) + '</button>';
        }).join('') + '</div>' +
        '<div class="searchbar" style="margin-bottom:14px">' +
          '<span class="searchbar__ico">' + U.icon('i-sparkle') + '</span>' +
          '<input type="text" placeholder="What should I wear for…" data-ask aria-label="Ask the AI stylist">' +
        '</div>' +
        '<button class="btn btn--primary btn--block" data-generate>Generate Ideas</button>' +
        '<div data-answer aria-live="polite" aria-atomic="true"></div>' +
      '</div>';
    },

    unmount: function () { clearTimeout(answerTimer); },

    mount: function (view) {
      function repaint() { view.querySelector('[data-grid]').innerHTML = grid(); }

      /* save a generated look once, then reuse it */
      function persist(o) {
        var existing = savedLook(o);
        if (existing) return existing;
        var rec = S.addOutfit({
          name: o.name, items: o.items, occasion: o.occasion,
          season: 'All season', notes: 'Generated by AI Stylist.', fav: false
        });
        savedByKey[o.key] = rec.id;
        return rec;
      }

      U.on(view, 'click', '[data-tab]', function (e, t) {
        active = t.dataset.tab;
        U.$$('.tab[data-tab]', view).forEach(function (b) {
          b.classList.toggle('is-active', b.dataset.tab === active);
        });
        repaint();
      });

      U.on(view, 'click', '[data-open-look]', function (e, t) {
        var o = generated[+t.dataset.openLook];
        if (!o) return;
        w.Router.go('#/outfit/' + persist(o).id);
      });

      U.on(view, 'click', '[data-save-look]', function (e, t) {
        e.stopPropagation();
        var o = generated[+t.dataset.saveLook];
        if (!o) return;
        var rec = persist(o);
        var on = S.toggleFavOutfit(rec.id);
        t.classList.toggle('is-on', on);
        t.setAttribute('aria-pressed', on ? 'true' : 'false');
        U.toast(on ? 'Saved to your outfits' : 'Removed from favourites', 'success');
      });

      var input = view.querySelector('[data-ask]');
      U.on(view, 'click', '[data-prompt]', function (e, t) {
        input.value = t.dataset.prompt;
        run();
      });

      function run() {
        var q = input.value.trim();
        if (!q) return U.toast('Ask me something first.', 'error');
        clearTimeout(answerTimer);
        var button = view.querySelector('[data-generate]');
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        button.textContent = 'Creating your look…';
        var box = view.querySelector('[data-answer]');
        box.innerHTML = '<div class="stylist__answer af-row gap2">' +
          '<span class="thinking"><i></i><i></i><i></i></span> <span class="t-dim">Putting a look together…</span></div>';

        answerTimer = setTimeout(function () {
          if (!view.isConnected) return;
          button.disabled = false;
          button.removeAttribute('aria-busy');
          button.textContent = 'Generate Ideas';
          var res = R.ask(q);
          if (!res.outfit) {
            box.innerHTML = '<div class="stylist__answer">I need a few more pieces in your wardrobe before I can build that look.</div>';
            return;
          }
          var o = res.outfit;
          box.innerHTML = '<div class="stylist__answer">' +

/* ==========================================================
   SCREENS - WARDROBE STATS
   Mirrors the reference "Wardrobe Stats" screen: usage donut,
   most-used categories, and the derived style profile.
   ========================================================== */
(function (w) {
  'use strict';
  var U = w.UI, S = w.Store, D = w.Data;
  var Screens = w.Screens = w.Screens || {};

  /* derive a dominant style from the wardrobe + stated preferences */
  function styleProfile() {
    var counts = {};
    S.state.wardrobe.forEach(function (i) { counts[i.style] = (counts[i.style] || 0) + 1; });
    var u = S.user();
    if (u && u.prefs && u.prefs.styles) {
      u.prefs.styles.forEach(function (s) { counts[s] = (counts[s] || 0) + 3; });
    }
    var best = null, total = 0;
    Object.keys(counts).forEach(function (k) {
      total += counts[k];
      if (!best || counts[k] > counts[best]) best = k;
    });
    if (!best) return { name: 'Not set yet', pct: 0, blurb: 'Add a few items to reveal your style profile.' };

    var blurbs = {
      'Minimal': 'Clean, simple and elegant.',
      'Casual': 'Relaxed and easy to live in.',
      'Aesthetic': 'Soft tones with considered detail.',
      'Streetwear': 'Relaxed silhouettes with attitude.',
      'Professional': 'Sharp, structured and workplace-ready.',
      'Formal': 'Classic tailoring, quietly confident.',
      'Party': 'Statement pieces made for evenings.',
      'Sporty': 'Practical and built to move.',
      'College': 'Everyday comfort with personality.',
      'Traditional': 'Occasion-led and timeless.'
    };
    return {
      name: best,
      pct: Math.round((counts[best] / total) * 100),
      blurb: blurbs[best] || 'A blend of several directions.'
    };
  }

  function colourSpread() {
    var counts = {};
    S.state.wardrobe.forEach(function (i) { counts[i.colorName] = (counts[i.colorName] || 0) + 1; });
    return Object.keys(counts)
      .map(function (k) { return { name: k, n: counts[k], hex: D.colourHex(k) }; })
      .sort(function (a, b) { return b.n - a.n; })
      .slice(0, 8);
  }

  Screens.stats = {
    shell: true,
    tab: 'account',
    topbar: function () {
      return { back: true, title: 'Wardrobe Stats', right: '' };
    },

    render: function () {
      var st = S.stats();
      var sp = styleProfile();
      var cols = colourSpread();
      var dots = 10, on = Math.round(sp.pct / 10);

      return '' +
      '<div class="sec" style="margin-top:12px">' +
        '<div class="sec__head"><div class="sec__title">Wardrobe Usage</div>' +
          '<span class="t-xs t-dim">Saved outfits</span></div>' +
        '<div class="card card--pad">' +
          '<div class="usage">' +
            U.donut(st.usagePct, 96, 11) +
            '<div class="grow">' +
              '<div class="usage__t">' + (st.usagePct >= 70 ? 'Great going!' : st.usagePct >= 40 ? 'Getting there' : 'Room to explore') + '</div>' +
              '<div class="usage__s">You are using ' + st.usagePct + '% of your wardrobe across ' + st.outfits + ' saved outfits.</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="sec__head"><div class="sec__title">Items by category</div></div>' +
        '<div class="card card--pad">' +
          (st.byCat.length
            ? '<div class="barlist">' + st.byCat.map(function (r) {
                return '<div class="barrow">' +
                  '<div class="barrow__k">' + U.esc(r.label) + '</div>' +
                  '<div class="bar"><div class="bar__fill" style="width:' + Math.max(4, r.pct) + '%"></div></div>' +
                  '<div class="barrow__v">' + r.pct + '%</div>' +
                '</div>';
              }).join('') + '</div>'
            : '<p class="t-sm t-dim">Nothing to measure yet.</p>') +
        '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="sec__head"><div class="sec__title">Your Style Profile</div></div>' +
        '<div class="card">' +
          '<div class="profileStyle">' +
            '<div class="grow">' +
              '<div class="profileStyle__t">' + U.esc(sp.name) + '</div>' +
              '<div class="dots" style="margin-top:10px">' + Array.apply(null, Array(dots)).map(function (_, i) {
                return '<i class="' + (i < on ? 'is-on' : '') + '"></i>';
              }).join('') + '</div>' +
              '<div class="profileStyle__s">' + U.esc(sp.blurb) + '</div>' +
            '</div>' +
            '<div class="profileStyle__ring">' + U.icon('i-hanger') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<div class="sec__head"><div class="sec__title">Colour Palette</div>' +
          '<span class="sec__link">' + cols.length + ' shades</span></div>' +
        '<div class="card card--pad">' +
          (cols.length
            ? '<div class="barlist">' + cols.map(function (c) {
                var pct = Math.round((c.n / (S.state.wardrobe.length || 1)) * 100);
                return '<div class="barrow">' +
                  '<div class="barrow__k af-row gap2"><i class="itemcard__dot" style="background:' + c.hex + '"></i>' +
                    '<span class="trunc">' + U.esc(c.name) + '</span></div>' +
                  '<div class="bar"><div class="bar__fill" style="width:' + Math.max(4, pct) + '%;background:' + c.hex + '"></div></div>' +
                  '<div class="barrow__v">' + c.n + '</div>' +
                '</div>';
              }).join('') + '</div>'
            : '<p class="t-sm t-dim">Add items to see your palette.</p>') +
        '</div>' +
      '</div>';
    },

    mount: function () {}
  };
})(window);

  /* ==========================================================
     DATA LAYER  (Admin.store)
     Reads / writes Store.state and calls Store.save().

     User records are extended with role, status, lastLogin.

  function templateDef(id) {
    for (var i = 0; i < TEMPLATES.length; i++) if (TEMPLATES[i].id === id) return TEMPLATES[i];
    return null;
  }

  function firstEmail() {
    var users = (S.state && S.state.users) || {};
    var best = null;
    Object.keys(users).forEach(function (e) {
      var u = users[e];

    });
    return best;

  /* Strict: administration is granted by role only, never inferred from
     being the first account. The admin account is provisioned in store.js. */
  function isAdminEmail(email) {
    if (!S.state || !S.state.users) return false;
    var u = S.state.users[email];
    return !!u && u.role === 'admin';
  }
  function isAdmin() {
    var u = S.user();
    return !!u && isAdminEmail(u.email);

  /* create missing keys with defaults; returns true if anything changed */
  function ensure() {
    var st = S.state; if (!st) return false;
    var changed = false;

    if (!st.smtp) { st.smtp = Object.assign({}, SMTP_DEFAULTS); changed = true; }
    if (!st.adminSettings) { st.adminSettings = Object.assign({}, SETTINGS_DEFAULTS); changed = true; }
    if (!st.emailTemplates) st.emailTemplates = {};
    TEMPLATES.forEach(function (t) {
      if (!st.emailTemplates[t.id]) {
        st.emailTemplates[t.id] = { subject: t.subject, body: t.body };
        changed = true;
      }
    });

    Object.keys(st.users || {}).forEach(function (e) {
      var u = st.users[e];
      if (!u.role) { u.role = 'user'; changed = true; }
      if (!u.status) { u.status = 'active'; changed = true; }
      if (typeof u.lastLogin === 'undefined') { u.lastLogin = null; changed = true; }
    });

    if (changed) S.save();
    return changed;
  }

  function users() {
    ensure();
    var map = S.state.users || {};
    return Object.keys(map).map(function (e) { return map[e]; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
  }

  function updateUser(email, patch) {

    if ((isOwner(email) || me().email === email) &&

  }

    requireAdmin();
    if (isOwner(email) || me().email === email) throw new Error('The owner and your own account cannot be deleted.');
    if (!S.state.users[email]) return false;
    delete S.state.users[email];
    if (S.state.libraries) delete S.state.libraries[email];
    if (S.state.session && S.state.session.email === email) S.state.session = null;
    S.save(); return true;
  }
